.schedule-field-days {

}

.schedule-field-days .schedule-days-list {

    gap: 4px 8px;

    gap: 6px;

    min-width: 0;

.schedule-cell-wrap {

    gap: 2px;

    min-width: 56px;

    min-width: 0;
    padding: 4px 6px;

/* Image slot grid + transfer progress */

    margin: 0.5rem 0 0;

}

.img-slot-actions {

.img-slot-hint {

}

    margin: 0.45rem 0 0.65rem;

.img-slot {

    flex-direction: column;

.img-slot:hover {

.img-slot.is-selected {

.img-slot-label {

.img-slot-dot {

/* ---- App modal / toast / busy bar (match text-project UX) ---- */
.modal {
    position: fixed;
    inset: 0;
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1rem;
}

.modal[hidden] {
    display: none !important;
}

.modal-backdrop {
    position: absolute;
    inset: 0;
    background: rgba(22, 24, 20, 0.45);
    backdrop-filter: blur(4px);
}

.modal-sheet {
    position: relative;
    z-index: 1;
    width: min(100%, 26rem);
    max-height: min(90vh, 40rem);
    overflow: auto;
    background: #f4f6f4;
    border: 1px solid #ccc;
    box-shadow: 0 8px 28px rgba(0, 0, 0, 0.18);
}

.modal-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem;
    padding: 0.95rem 1rem 0.7rem;
    border-bottom: 1px solid #ddd;
}

.modal-head h3 {
    margin: 0;
    font-size: 1.05rem;
    font-weight: 700;
}

.modal-x {
    appearance: none;
    border: none;
    background: transparent;
    color: #666;
    font-size: 1.45rem;
    line-height: 1;
    cursor: pointer;
    padding: 0.15rem 0.35rem;
}

.modal-body {
    padding: 1rem;
}

.modal-body > p {
    margin: 0;
    color: #444;
    font-size: 0.95rem;
    line-height: 1.55;
    white-space: pre-wrap;
}

.modal-foot {
    display: flex;
    flex-wrap: wrap;
    justify-content: flex-end;
    gap: 0.5rem;
    padding: 0.75rem 1rem 1rem;
    border-top: 1px solid #ddd;
}

.device-busy-bar {
    position: sticky;
    top: 0;
    z-index: 900;
    display: flex;
    align-items: center;
    gap: 0.55rem;
    padding: 0.55rem 1rem;
    background: #2c342c;
    color: #f2f5f1;
    font-size: 0.85rem;
    font-weight: 500;
    box-shadow: 0 2px 10px rgba(22, 24, 20, 0.18);
}

.device-busy-bar[hidden] {
    display: none !important;
}

.device-busy-dot {
    width: 0.55rem;
    height: 0.55rem;
    border-radius: 50%;
    background: #e8b86d;
    animation: busy-pulse 1.1s ease-in-out infinite;
}

@keyframes busy-pulse {
    0%, 100% { opacity: 0.45; transform: scale(0.9); }
    50% { opacity: 1; transform: scale(1.05); }
}

.toast-host {
    position: fixed;
    left: 50%;
    bottom: max(1.25rem, env(safe-area-inset-bottom));
    transform: translateX(-50%);
    z-index: 1100;
    display: flex;
    flex-direction: column-reverse;
    align-items: center;
    gap: 0.45rem;
    width: min(92vw, 22rem);
    pointer-events: none;
}

.toast {
    width: 100%;
    padding: 0.7rem 0.95rem;
    border: 1px solid #ccc;
    background: #f4f6f4;
    color: #1a1e1a;
    font-size: 0.84rem;
    line-height: 1.35;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.22s ease, transform 0.22s ease;
}

.toast.toast-show {
    opacity: 1;
    transform: translateY(0);
}

.toast-ok {
    border-color: #6a8f6a;
    background: #e8f0e8;
}

.toast-warn {
    border-color: #c9a05a;
    background: #f7f0e2;
}

.toast-err {
    border-color: #b85c4a;
    background: #f6e8e4;
}

body.debug-mode .modal-sheet {

    color: var(--dark-text);
}

body.debug-mode .modal-head,
body.debug-mode .modal-foot {
    border-color: var(--dark-border);
}

    <script type="text/javascript">
// Ported from: https://e-paper-display.cn/usb2epd.html

// 固定的六色调色板
const rgbPalette = [
  { name: "黄色", r: 255, g: 255, b: 0, value: 0xe2 },
  { name: "绿色", r: 41, g: 204, b: 20, value: 0x96 },
  { name: "蓝色", r: 0, g: 0, b: 255, value: 0x1d },
  { name: "红色", r: 255, g: 0, b: 0, value: 0x4c },
  { name: "黑色", r: 0, g: 0, b: 0, value: 0x00 },
  { name: "白色", r: 255, g: 255, b: 255, value: 0xff }
];

// 四色调色板
const fourColorPalette = [
  { name: "黑色", r: 0, g: 0, b: 0, value: 0x00 },
  { name: "白色", r: 255, g: 255, b: 255, value: 0x01 },
  { name: "红色", r: 255, g: 0, b: 0, value: 0x03 },
  { name: "黄色", r: 255, g: 255, b: 0, value: 0x02 }
];

// 三色调色板
const threeColorPalette = [
  { name: "黑色", r: 0, g: 0, b: 0, value: 0x00 },
  { name: "白色", r: 255, g: 255, b: 255, value: 0x01 },
  { name: "红色", r: 255, g: 0, b: 0, value: 0x02 }
];

function adjustContrast(imageData, factor) {
  const data = imageData.data;
  for (let i = 0; i < data.length; i += 4) {
    data[i] = Math.min(255, Math.max(0, (data[i] - 128) * factor + 128));
    data[i + 1] = Math.min(255, Math.max(0, (data[i + 1] - 128) * factor + 128));
    data[i + 2] = Math.min(255, Math.max(0, (data[i + 2] - 128) * factor + 128));
  }
  return imageData;
}

function rgbToLab(r, g, b) {
  r = r / 255;
  g = g / 255;
  b = b / 255;

  r = r > 0.04045 ? Math.pow((r + 0.055) / 1.055, 2.4) : r / 12.92;
  g = g > 0.04045 ? Math.pow((g + 0.055) / 1.055, 2.4) : g / 12.92;
  b = b > 0.04045 ? Math.pow((b + 0.055) / 1.055, 2.4) : b / 12.92;

  r *= 100;
  g *= 100;
  b *= 100;

  let x = r * 0.4124 + g * 0.3576 + b * 0.1805;
  let y = r * 0.2126 + g * 0.7152 + b * 0.0722;
  let z = r * 0.0193 + g * 0.1192 + b * 0.9505;

  x /= 95.047;
  y /= 100.0;
  z /= 108.883;

  x = x > 0.008856 ? Math.pow(x, 1 / 3) : (7.787 * x) + (16 / 116);
  y = y > 0.008856 ? Math.pow(y, 1 / 3) : (7.787 * y) + (16 / 116);
  z = z > 0.008856 ? Math.pow(z, 1 / 3) : (7.787 * z) + (16 / 116);

  const l = (116 * y) - 16;
  const a = 500 * (x - y);
  const bLab = 200 * (y - z);

  return { l, a, b: bLab };
}

function labDistance(lab1, lab2) {
  const dl = lab1.l - lab2.l;
  const da = lab1.a - lab2.a;
  const db = lab1.b - lab2.b;
  return Math.sqrt(0.2 * dl * dl + 3 * da * da + 3 * db * db);
}

function findClosestColor(r, g, b, mode) {
  let palette;

  if (mode === 'fourColor') {
    palette = fourColorPalette;
  } else if (mode === 'threeColor') {
    palette = threeColorPalette;
  } else {
    palette = rgbPalette;
  }

  // 蓝色特殊情况（仅限非三色、四色模式）
  if (mode !== 'fourColor' && mode !== 'threeColor' && r < 50 && g < 150 && b > 100) {
    return rgbPalette[2]; // 蓝色
  }

  // 三色模式下优先检测红色
  if (mode === 'threeColor') {
    // 如果红色通道显著高于绿色和蓝色，且强度足够
    if (r > 120 && r > g * 1.5 && r > b * 1.5) {
      return threeColorPalette[2]; // 红色
    }
    // 否则根据亮度选择黑或白
    const luminance = 0.299 * r + 0.587 * g + 0.114 * b;
    return luminance < 128 ? threeColorPalette[0] : threeColorPalette[1]; // 黑色或白色
  }

  const inputLab = rgbToLab(r, g, b);
  let minDistance = Infinity;
  let closestColor = palette[0];

  for (const color of palette) {
    const colorLab = rgbToLab(color.r, color.g, color.b);
    const distance = labDistance(inputLab, colorLab);
    if (distance < minDistance) {
      minDistance = distance;
      closestColor = color;
    }
  }

  return closestColor;
}

function floydSteinbergDither(imageData, strength, mode) {
  const width = imageData.width;
  const height = imageData.height;
  const data = imageData.data;
  const tempData = new Uint8ClampedArray(data);

  for (let y = 0; y < height; y++) {
    for (let x = 0; x < width; x++) {
      const idx = (y * width + x) * 4;
      const r = tempData[idx];
      const g = tempData[idx + 1];
      const b = tempData[idx + 2];

      const closest = findClosestColor(r, g, b, mode);

      const errR = (r - closest.r) * strength;
      const errG = (g - closest.g) * strength;
      const errB = (b - closest.b) * strength;

      if (x + 1 < width) {
        const idxRight = idx + 4;
        tempData[idxRight] = Math.min(255, Math.max(0, tempData[idxRight] + errR * 7 / 16));
        tempData[idxRight + 1] = Math.min(255, Math.max(0, tempData[idxRight + 1] + errG * 7 / 16));
        tempData[idxRight + 2] = Math.min(255, Math.max(0, tempData[idxRight + 2] + errB * 7 / 16));
      }
      if (y + 1 < height) {
        if (x > 0) {
          const idxDownLeft = idx + width * 4 - 4;
          tempData[idxDownLeft] = Math.min(255, Math.max(0, tempData[idxDownLeft] + errR * 3 / 16));
          tempData[idxDownLeft + 1] = Math.min(255, Math.max(0, tempData[idxDownLeft + 1] + errG * 3 / 16));
          tempData[idxDownLeft + 2] = Math.min(255, Math.max(0, tempData[idxDownLeft + 2] + errB * 3 / 16));
        }
        const idxDown = idx + width * 4;
        tempData[idxDown] = Math.min(255, Math.max(0, tempData[idxDown] + errR * 5 / 16));
        tempData[idxDown + 1] = Math.min(255, Math.max(0, tempData[idxDown + 1] + errG * 5 / 16));
        tempData[idxDown + 2] = Math.min(255, Math.max(0, tempData[idxDown + 2] + errB * 5 / 16));
        if (x + 1 < width) {
          const idxDownRight = idx + width * 4 + 4;
          tempData[idxDownRight] = Math.min(255, Math.max(0, tempData[idxDownRight] + errR * 1 / 16));
          tempData[idxDownRight + 1] = Math.min(255, Math.max(0, tempData[idxDownRight + 1] + errG * 1 / 16));
          tempData[idxDownRight + 2] = Math.min(255, Math.max(0, tempData[idxDownRight + 2] + errB * 1 / 16));
        }
      }
    }
  }

  for (let y = 0; y < height; y++) {
    for (let x = 0; x < width; x++) {
      const idx = (y * width + x) * 4;
      const r = tempData[idx];
      const g = tempData[idx + 1];
      const b = tempData[idx + 2];

      const closest = findClosestColor(r, g, b, mode);
      data[idx] = closest.r;
      data[idx + 1] = closest.g;
      data[idx + 2] = closest.b;
    }
  }

  return imageData;
}

function atkinsonDither(imageData, strength, mode) {
  const width = imageData.width;
  const height = imageData.height;
  const data = imageData.data;
  const tempData = new Uint8ClampedArray(data);

  for (let y = 0; y < height; y++) {
    for (let x = 0; x < width; x++) {
      const idx = (y * width + x) * 4;
      const r = tempData[idx];
      const g = tempData[idx + 1];
      const b = tempData[idx + 2];

      const closest = findClosestColor(r, g, b, mode);

      data[idx] = closest.r;
      data[idx + 1] = closest.g;

function bayerDither(imageData, strength, mode) {
  const width = imageData.width;
  const height = imageData.height;
  const data = imageData.data;

  // 8x8 Bayer matrix (normalized to 0-1 range)
  const bayerMatrix = [
    [0, 32, 8, 40, 2, 34, 10, 42],
    [48, 16, 56, 24, 50, 18, 58, 26],
    [12, 44, 4, 36, 14, 46, 6, 38],
    [60, 28, 52, 20, 62, 30, 54, 22],
    [3, 35, 11, 43, 1, 33, 9, 41],
    [51, 19, 59, 27, 49, 17, 57, 25],
    [15, 47, 7, 39, 13, 45, 5, 37],
    [63, 31, 55, 23, 61, 29, 53, 21]
  ];

  const matrixSize = 8;
  const maxThreshold = 64;

  for (let y = 0; y < height; y++) {
    for (let x = 0; x < width; x++) {
      const idx = (y * width + x) * 4;
      const r = data[idx];
      const g = data[idx + 1];
      const b = data[idx + 2];

      // Get threshold from Bayer matrix
      const matrixX = x % matrixSize;
      const matrixY = y % matrixSize;
      const threshold = (bayerMatrix[matrixY][matrixX] / maxThreshold) * 255;

      // Apply dithering with strength factor
      const adjustedR = r + (threshold - 127.5) * strength;
      const adjustedG = g + (threshold - 127.5) * strength;
      const adjustedB = b + (threshold - 127.5) * strength;

      // Clamp values
      const clampedR = Math.min(255, Math.max(0, adjustedR));
      const clampedG = Math.min(255, Math.max(0, adjustedG));
      const clampedB = Math.min(255, Math.max(0, adjustedB));

      // Find closest color in palette
      const closest = findClosestColor(clampedR, clampedG, clampedB, mode);
      
      data[idx] = closest.r;
      data[idx + 1] = closest.g;
      data[idx + 2] = closest.b;
    }
  }

  return imageData;
}

function ditherImage(imageData, alg, strength, mode) {
  switch (alg) {

}

function decodeProcessedData(processedData, width, height, mode) {

        data[index + 2] = color.b;
        data[index + 3] = 255; // Alpha 透明度
      }
    }
  } else if (mode === 'fourColor') {
    const fourColorValues = [
      { value: 0x00, r: 0, g: 0, b: 0 },      // 黑色
      { value: 0x01, r: 255, g: 255, b: 255 }, // 白色
      { value: 0x03, r: 255, g: 0, b: 0 },     // 红色
      { value: 0x02, r: 255, g: 255, b: 0 }    // 黄色
    ];
    for (let y = 0; y < height; y++) {
      for (let x = 0; x < width; x++) {
        const newIndex = (y * width + x) / 4 | 0;
        const shift = 6 - ((x % 4) * 2);
        const value = (processedData[newIndex] >> shift) & 0x03;
        const color = fourColorValues.find(c => c.value === value) || fourColorValues[1]; // 默认白色
        const index = (y * width + x) * 4;
        data[index] = color.r;
        data[index + 1] = color.g;
        data[index + 2] = color.b;
        data[index + 3] = 255;
      }
    }
  } else if (mode === 'blackWhiteColor') {
    const byteWidth = Math.ceil(width / 8);
    for (let y = 0; y < height; y++) {
      for (let x = 0; x < width; x++) {
        const byteIndex = y * byteWidth + Math.floor(x / 8);
        const bitIndex = 7 - (x % 8);
        const bit = (processedData[byteIndex] >> bitIndex) & 1;
        const index = (y * width + x) * 4;
        data[index] = bit ? 255 : 0; // 白或黑
        data[index + 1] = bit ? 255 : 0;
        data[index + 2] = bit ? 255 : 0;
        data[index + 3] = 255;
      }
    }
  } else if (mode === 'threeColor') {
    const byteWidth = Math.ceil(width / 8);
    const blackWhiteData = processedData.slice(0, byteWidth * height);
    const redWhiteData = processedData.slice(byteWidth * height);
    for (let y = 0; y < height; y++) {
      for (let x = 0; x < width; x++) {
        const byteIndex = y * byteWidth + Math.floor(x / 8);
        const bitIndex = 7 - (x % 8);
        const blackWhiteBit = (blackWhiteData[byteIndex] >> bitIndex) & 1;
        const redWhiteBit = (redWhiteData[byteIndex] >> bitIndex) & 1;
        const index = (y * width + x) * 4;
        if (!redWhiteBit) {
          // 红色
          data[index] = 255;
          data[index + 1] = 0;
          data[index + 2] = 0;
        } else {
          // 黑或白
          data[index] = blackWhiteBit ? 255 : 0;
          data[index + 1] = blackWhiteBit ? 255 : 0;
          data[index + 2] = blackWhiteBit ? 255 : 0;
        }
        data[index + 3] = 255;
      }
    }
  }

  return imageData;
}

        const r = data[index];

        const b = data[index + 2];

        const newIndex = (x * height) + (height - 1 - y);

      }

  } else if (mode === 'fourColor') {
    processedData = new Uint8Array(Math.ceil((width * height) / 4));

        const g = data[index + 1];
        const b = data[index + 2];
        const closest = findClosestColor(r, g, b, mode); // 使用 fourColorPalette
        const colorValue = closest.value; // 0x00 (黑), 0x01 (白), 0x02 (红), 0x03 (黄)
        const newIndex = (y * width + x) / 4 | 0;
        const shift = 6 - ((x % 4) * 2);
        processedData[newIndex] |= (colorValue << shift);

        const b = data[index + 2];
        const grayscale = Math.round(0.299 * r + 0.587 * g + 0.114 * b);
        const bit = grayscale >= threshold ? 1 : 0;
        const byteIndex = y * byteWidth + Math.floor(x / 8);
        const bitIndex = 7 - (x % 8);
        processedData[byteIndex] |= (bit << bitIndex);
      }
    }
  } else if (mode === 'threeColor') {
    const byteWidth = Math.ceil(width / 8);
    const blackWhiteThreshold = 140;
    const redThreshold = 160;

    const blackWhiteData = new Uint8Array(height * byteWidth);
    const redWhiteData = new Uint8Array(height * byteWidth);

    for (let y = 0; y < height; y++) {
      for (let x = 0; x < width; x++) {
        const index = (y * width + x) * 4;
        const r = data[index];
        const g = data[index + 1];
        const b = data[index + 2];
        const grayscale = Math.round(0.299 * r + 0.587 * g + 0.114 * b);

        const blackWhiteBit = grayscale >= blackWhiteThreshold ? 1 : 0;
        const blackWhiteByteIndex = y * byteWidth + Math.floor(x / 8);
        const blackWhiteBitIndex = 7 - (x % 8);
        if (blackWhiteBit) {
          blackWhiteData[blackWhiteByteIndex] |= (0x01 << blackWhiteBitIndex);
        } else {
          blackWhiteData[blackWhiteByteIndex] &= ~(0x01 << blackWhiteBitIndex);
        }

        const redWhiteBit = (r > redThreshold && r > g && r > b) ? 0 : 1;
        const redWhiteByteIndex = y * byteWidth + Math.floor(x / 8);
        const redWhiteBitIndex = 7 - (x % 8);
        if (redWhiteBit) {
          redWhiteData[redWhiteByteIndex] |= (0x01 << redWhiteBitIndex);
        } else {
          redWhiteData[redWhiteByteIndex] &= ~(0x01 << redWhiteBitIndex);
        }
      }
    }

    processedData = new Uint8Array(blackWhiteData.length + redWhiteData.length);
    processedData.set(blackWhiteData, 0);
    processedData.set(redWhiteData, blackWhiteData.length);
  }

  return processedData;
}

function saveCanvasState() {

    canvasHistory.shift();
    historyStep--;

}

function undo() {
  if (historyStep > 0) {
    historyStep--;
    restoreCanvasState(canvasHistory[historyStep]);
    updateHistoryButtons();

}

function redo() {
  if (historyStep < canvasHistory.length - 1) {
    historyStep++;
    restoreCanvasState(canvasHistory[historyStep]);
    updateHistoryButtons();
  }

function restoreCanvasState(state) {
  if (!state) return;
  
  // Restore canvas data
  ctx.putImageData(state.canvasData, 0, 0);
  
  // Restore text and line elements

function startPaint(e) {
  if (!currentTool) return;

  if (currentTool === 'text') {
    // Check if we're clicking on a text element to drag
    const textElement = findTextElementAt(e);
    if (textElement && textElement === selectedTextElement) {
      isDraggingText = true;
      
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      const x = (e.clientX - rect.left) * scaleX;
      const y = (e.clientY - rect.top) * scaleY;
      
      // Calculate offset for smooth dragging
      dragOffsetX = textElement.x - x;
      dragOffsetY = textElement.y - y;
      
      return; // Don't start drawing

    painting = true;

  const wasDraggingText = isDraggingText;
  
  painting = false;
  isDraggingText = false;

  lastY = 0;
  
  // Save state after drawing or dragging text
  if (wasPainting || wasDraggingText) {
    saveCanvasState();

  if (!currentTool) return;

function draw(e) {

  const scaleY = canvas.height / rect.height;
  const x = (e.clientX - rect.left) * scaleX;
  const y = (e.clientY - rect.top) * scaleY;

    lineSegments.push({
      type: 'line',

  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  const x = (e.clientX - rect.left) * scaleX;
  const y = (e.clientY - rect.top) * scaleY;

  selectedTextElement.x = x + dragOffsetX;
  selectedTextElement.y = y + dragOffsetY;

  if (draggingCanvasContext) {
    ctx.putImageData(draggingCanvasContext, 0, 0);

  }

function findTextElementAt(e) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  const x = (e.clientX - rect.left) * scaleX;
  const y = (e.clientY - rect.top) * scaleY;
  
  // Search through text elements in reverse order (top-most first)
  for (let i = textElements.length - 1; i >= 0; i--) {
    const text = textElements[i];

    ctx.font = text.font;
    const textWidth = ctx.measureText(text.text).width;

    // Extract font size correctly from the font string
    // This handles "bold 14px Arial", "italic 14px Arial", "bold italic 14px Arial", etc.
    const fontSizeMatch = text.font.match(/(\d+)px/);
    const fontSize = fontSizeMatch ? parseInt(fontSizeMatch[1]) : 14; // Default to 14 if not found
    const textHeight = fontSize * 1.2; // Approximate height
    
    // Check if click is within text bounds (allowing for some margin)
    const margin = 5;
    if (x >= text.x - margin && 
        x <= text.x + textWidth + margin && 
        y >= text.y - textHeight + margin && 
        y <= text.y + margin) {
      return text;
    }
  }

function startTextPlacement() {
  const text = document.getElementById('text-input').value.trim();
  if (!text) {

  canvas.classList.remove('text-placement-mode');

  isDraggingText = false;
  dragOffsetX = 0;
  dragOffsetY = 0;
  selectedTextElement = null;

function placeText(e) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  const x = (e.clientX - rect.left) * scaleX;
  const y = (e.clientY - rect.top) * scaleY;

  const text = document.getElementById('text-input').value;
  const fontFamily = document.getElementById('font-family').value;
  const fontSize = document.getElementById('font-size').value;

  // Build font style string
  let fontStyle = '';
  if (textItalic) fontStyle += 'italic ';
  if (textBold) fontStyle += 'bold ';
  
  // Create a new text element
  const newText = {
    text: text,
    x: x,
    y: y,
    font: `${fontStyle}${fontSize}px ${fontFamily}`,
    color: brushColor
  };
  
  // Add to our list of text elements
  textElements.push(newText);
  
  // Select this text element for immediate dragging
  selectedTextElement = newText;
  draggingCanvasContext = ctx.getImageData(0, 0, canvas.width, canvas.height);
  
  // Draw text on canvas
  ctx.font = newText.font;
  ctx.fillStyle = newText.color;
  ctx.fillText(newText.text, newText.x, newText.y);
  
  // Save state after adding text
  saveCanvasState();
  
  // Reset
  document.getElementById('text-input').value = '';
  isTextPlacementMode = false;
  canvas.classList.remove('text-placement-mode');
  setCanvasTitle('拖动新添加文字可调整位置');
}

function redrawTextElements() {
  // Redraw all text elements after dithering
  textElements.forEach(item => {
    ctx.font = item.font;
    ctx.fillStyle = item.color;
    ctx.fillText(item.text, item.x, item.y);
  });
}

function redrawLineSegments() {
  // Redraw all line segments after dithering
  lineSegments.forEach(segment => {
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.strokeStyle = segment.color;
    ctx.lineWidth = segment.size;
    ctx.beginPath();
    
    if (segment.type === 'dot') {
      ctx.moveTo(segment.x, segment.y);
      ctx.lineTo(segment.x+0.1, segment.y+0.1);
    } else {
      ctx.moveTo(segment.x1, segment.y1);
      ctx.lineTo(segment.x2, segment.y2);
    }
    
    ctx.stroke();
  });
}

let backgroundZoom = 1;
let backgroundPanX = 0;
let backgroundPanY = 0;
let isPanning = false;
let lastPanX = 0;
let lastPanY = 0;
let lastTouchDistance = 0;

function resetCropStates() {
  backgroundZoom = 1;
  backgroundPanX = 0;
  backgroundPanY = 0;
  isPanning = false;
  lastPanX = 0;
  lastPanY = 0;
}

function isCropMode() {
  return canvas.parentNode.classList.contains('crop-mode');
}

function exitCropMode() {
  canvas.parentNode.classList.remove('crop-mode');
  setCanvasTitle("");

  canvas.removeEventListener('wheel', handleBackgroundZoom);
  canvas.removeEventListener('mousedown', handleBackgroundPanStart);
  canvas.removeEventListener('mousemove', handleBackgroundPan);
  canvas.removeEventListener('mouseup', handleBackgroundPanEnd);
  canvas.removeEventListener('mouseleave', handleBackgroundPanEnd);
  canvas.removeEventListener('touchstart', handleTouchStart);
  canvas.removeEventListener('touchmove', handleTouchMove);
  canvas.removeEventListener('touchend', handleBackgroundPanEnd);
  canvas.removeEventListener('touchcancel', handleBackgroundPanEnd);
  if (typeof updateButtonStatus === 'function') updateButtonStatus();
}

function initializeCrop() {
  const imageFile = document.getElementById('imageFile');
  if (imageFile.files.length == 0) {
    fillCanvas('white');
    return;
  }

  exitCropMode();
  resetCropStates();

  canvas.style.backgroundImage = `url(${URL.createObjectURL(imageFile.files[0])})`;
  canvas.style.backgroundSize = '100%';
  canvas.style.backgroundPosition = '';
  canvas.style.backgroundRepeat = 'no-repeat';

  // add event listeners for zoom and pan
  canvas.addEventListener('wheel', handleBackgroundZoom);
  canvas.addEventListener('mousedown', handleBackgroundPanStart);
  canvas.addEventListener('mousemove', handleBackgroundPan);
  canvas.addEventListener('mouseup', handleBackgroundPanEnd);
  canvas.addEventListener('mouseleave', handleBackgroundPanEnd);

  // Touch events for mobile devices
  canvas.addEventListener('touchstart', handleTouchStart);
  canvas.addEventListener('touchmove', handleTouchMove);
  canvas.addEventListener('touchend', handleBackgroundPanEnd);
  canvas.addEventListener('touchcancel', handleBackgroundPanEnd);

  // Make the canvas transparent
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  setCanvasTitle("裁剪模式: 可用鼠标滚轮或双指触摸缩放图片");
  canvas.parentNode.classList.add('crop-mode');
  if (typeof updateButtonStatus === 'function') updateButtonStatus();
}

function finishCrop() {
  const imageFile = document.getElementById('imageFile');
  if (imageFile.files.length == 0) return;

  const image = new Image();
  image.onload = function () {
    URL.revokeObjectURL(this.src);

    const fieldsetRect = canvas.getBoundingClientRect();
    const scale = (image.width / fieldsetRect.width) / backgroundZoom;

    const sx = -backgroundPanX * scale;
    const sy = -backgroundPanY * scale;
    const sWidth = fieldsetRect.width * scale;
    const sHeight = fieldsetRect.height * scale;

    fillCanvas('white');
    ctx.drawImage(image, sx, sy, sWidth, sHeight, 0, 0, canvas.width, canvas.height);

    redrawTextElements();
    redrawLineSegments();
    convertDithering();

    exitCropMode();
    saveCanvasState(); // Save state after finishing crop
    if (typeof updateButtonStatus === 'function') updateButtonStatus();
  };
  image.src = URL.createObjectURL(imageFile.files[0]);
}

function handleTouchStart(e) {
  e.preventDefault();
  if (e.touches.length === 1) {
    handleBackgroundPanStart(e.touches[0]);
  } else if (e.touches.length === 2) {
    isPanning = false; // Stop panning when zooming
    lastTouchDistance = getTouchDistance(e.touches);
  }
}

function handleTouchMove(e) {
  e.preventDefault();
  if (isPanning && e.touches.length === 1) {
    handleBackgroundPan(e.touches[0]);
  } else if (e.touches.length === 2) {
    const newDist = getTouchDistance(e.touches);
    if (lastTouchDistance > 0) {
      const zoomFactor = newDist / lastTouchDistance;
      backgroundZoom *= zoomFactor;
      backgroundZoom = Math.max(0.1, Math.min(5, backgroundZoom)); // Limit zoom range
      updateBackgroundTransform();
    }
    lastTouchDistance = newDist;
  }
}

function handleBackgroundZoom(e) {
  e.preventDefault();
  const zoomFactor = e.deltaY > 0 ? 0.9 : 1.1;
  backgroundZoom *= zoomFactor;
  backgroundZoom = Math.max(0.1, Math.min(5, backgroundZoom)); // Limit zoom range
  updateBackgroundTransform();
}

function handleBackgroundPanStart(e) {
  isPanning = true;
  lastPanX = e.clientX;
  lastPanY = e.clientY;
  canvas.style.cursor = 'grabbing';
}

function handleBackgroundPan(e) {
  if (isPanning) {
    const deltaX = e.clientX - lastPanX;
    const deltaY = e.clientY - lastPanY;
    backgroundPanX += deltaX;
    backgroundPanY += deltaY;
    lastPanX = e.clientX;
    lastPanY = e.clientY;
    updateBackgroundTransform();
  }
}

function handleBackgroundPanEnd() {
  isPanning = false;
  lastTouchDistance = 0; // Reset touch distance
  canvas.style.cursor = 'grab';
}

function updateBackgroundTransform() {
  canvas.style.backgroundSize = `${100 * backgroundZoom}%`;
  canvas.style.backgroundPosition = `${backgroundPanX}px ${backgroundPanY}px`;
}

function getTouchDistance(touches) {
  const touch1 = touches[0];
  const touch2 = touches[1];
  return Math.sqrt(
    Math.pow(touch2.clientX - touch1.clientX, 2) +
    Math.pow(touch2.clientY - touch1.clientY, 2)
  );
}

function initCropTools() {
  document.getElementById('crop-zoom-in').addEventListener('click', (e) => {
    e.preventDefault();
    handleBackgroundZoom({ preventDefault: () => {}, deltaY: -1 });
  });

  document.getElementById('crop-zoom-out').addEventListener('click', (e) => {
    e.preventDefault();
    handleBackgroundZoom({ preventDefault: () => {}, deltaY: 1 });
  });

  document.getElementById('crop-move-left').addEventListener('click', (e) => {
    e.preventDefault();
    backgroundPanX -= 10;
    updateBackgroundTransform();
  });

  document.getElementById('crop-move-right').addEventListener('click', (e) => {
    e.preventDefault();
    backgroundPanX += 10;
    updateBackgroundTransform();
  });

  document.getElementById('crop-move-up').addEventListener('click', (e) => {
    e.preventDefault();
    backgroundPanY -= 10;
    updateBackgroundTransform();
  });

  document.getElementById('crop-move-down').addEventListener('click', (e) => {
    e.preventDefault();
    backgroundPanY += 10;
    updateBackgroundTransform();
  });
}

function addScheduleSlot() {

function updateScheduleSlotButtons() {

function getScheduleData() {
  var titleEl = document.getElementById('schedule-title');
  var title = (titleEl && titleEl.value.trim()) || '\u8bfe\u7a0b\u8868';
  var days = getScheduleDays();
  var slots = [];
  document.querySelectorAll('.schedule-slot-row').forEach(function(row) {
    var timeInput = row.querySelector('.schedule-slot-time');
    var time = timeInput ? timeInput.value.trim() || '--' : '--';
    var cells = [];
    var wraps = row.querySelectorAll('.schedule-cell-wrap');
    if (wraps.length) {
      wraps.forEach(function(wrap) {
        var input = wrap.querySelector('.schedule-slot-cell');
        var block = wrap.querySelector('.schedule-cell-color-block');
        var color = (block && block.getAttribute('data-color') === 'red') ? 'red' : 'black';
        cells.push({ text: (input && input.value) ? input.value.trim() : '', color: color });
      });

      row.querySelectorAll('.schedule-slot-cell').forEach(function(cell) {

function truncateText(ctx, text, maxWidth, suffix) {
  if (!text) return '';
  suffix = suffix || '\u2026';
  if (ctx.measureText(text).width <= maxWidth) return text;
  var low = 0;
  var high = text.length;
  while (low < high - 1) {
    var mid = Math.ceil((low + high) / 2);
    var sub = text.slice(0, mid) + suffix;
    if (ctx.measureText(sub).width <= maxWidth) low = mid;
    else high = mid;
  }
  var result = text.slice(0, low) + suffix;
  return ctx.measureText(result).width <= maxWidth ? result : text.slice(0, 1) + suffix;
}

// E-ink: fill only for consistent weight; no stroke to avoid uneven thickness
function fillTextEPD(ctx, text, x, y, color) {
  ctx.fillStyle = color;
  ctx.fillText(text, x, y);
}

function renderCourseScheduleToCanvas(canvas, ctx, data) {
  var cw = canvas.width;
  var ch = canvas.height;
  var margin = 8;
  var fontFamily = 'SimSun, "宋体", serif';
  var titleFamily = 'SimHei,  "黑体", sans-serif';

  var days = data.days || [];
  var slots = data.slots || [];
  var title = (data.title || '\u8bfe\u7a0b\u8868').trim() || '\u8bfe\u7a0b\u8868';

  var timeColWidth = 50;
  var tableLeft = Math.round(margin);
  var tableRight = Math.round(cw - margin);
  var tableWidth = tableRight - tableLeft;
  var dataWidth = tableWidth - timeColWidth;
  var colCount = days.length || 1;
  var colWidth = colCount > 0 ? dataWidth / colCount : dataWidth;

  var titleArea = 22;
  var rowCount = slots.length + 1;
  var tableHeight = Math.floor(ch - 2 * margin - titleArea - 4);
  var rowHeight = rowCount > 0 ? tableHeight / rowCount : 18;
  var titleFontSize = Math.min(18, Math.max(12, Math.floor(rowHeight * 1.1)));
  var headerFontSize = Math.max(9, Math.min(15, Math.floor(rowHeight * 0.72)));
  var cellFontSize = Math.max(7, Math.min(12, Math.floor(rowHeight * 0.5)));

  ctx.fillStyle = '#FFFFFF';
  ctx.fillRect(0, 0, cw, ch);

  var y = Math.round(margin);
  ctx.fillStyle = '#000000';
  ctx.font = '500 ' + titleFontSize + 'px ' + titleFamily;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  var titleX = Math.round(margin + tableWidth / 2);
  var titleY = Math.round(y + titleFontSize / 2 + 2);
  fillTextEPD(ctx, truncateText(ctx, title, tableWidth - 4), titleX, titleY, '#000000');
  y = Math.round(y + titleArea + 5);

  ctx.fillStyle = '#000000';
  ctx.fillRect(tableLeft, y, tableWidth, 1);
  ctx.fillRect(tableLeft, y + tableHeight - 1, tableWidth, 1);
  ctx.fillRect(tableLeft, y, 1, tableHeight);
  ctx.fillRect(tableLeft + tableWidth - 1, y, 1, tableHeight);

  ctx.font = headerFontSize + 'px ' + fontFamily;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  var headerCenterY = Math.round(y + rowHeight * 0.52);
  var x = tableLeft + Math.round(timeColWidth / 2);
  fillTextEPD(ctx, '\u65f6\u95f4', x, headerCenterY, '#000000');
  for (var d = 0; d < days.length; d++) {
    x = Math.round(tableLeft + timeColWidth + (d + 0.5) * colWidth);
    var label = DAY_LABELS[days[d]] || '';
    fillTextEPD(ctx, truncateText(ctx, label, colWidth - 2), x, headerCenterY, '#000000');
  }

  ctx.fillStyle = '#000000';
  for (var i = 0; i <= rowCount; i++) {
    var ly = Math.round(y + i * rowHeight);
    ctx.fillRect(tableLeft, ly, tableWidth, 1);
  }
  for (var col = 0; col <= colCount; col++) {
    var vx = col === 0 ? tableLeft : Math.round(tableLeft + timeColWidth + (col - 1) * colWidth);
    ctx.fillRect(vx, y, 1, tableHeight);
  }

  y += rowHeight;

  ctx.textBaseline = 'middle';
  for (var r = 0; r < slots.length; r++) {
    var slot = slots[r];
    var timeStr = truncateText(ctx, slot.time || '', timeColWidth - 4);
    ctx.font = cellFontSize + 'px ' + fontFamily;
    ctx.textAlign = 'center';
    var centerY = Math.round(y + rowHeight * 0.52);
    var timeX = Math.round(tableLeft + timeColWidth / 2);
    fillTextEPD(ctx, timeStr, timeX, centerY, '#000000');
    for (var c = 0; c < (slot.cells || []).length && c < days.length; c++) {
      var cellData = slot.cells[c];
      var cellText = typeof cellData === 'object' ? (cellData.text || '') : String(cellData || '');
      var cellColor = (typeof cellData === 'object' && cellData.color === 'red') ? '#FF0000' : '#000000';
      cellText = truncateText(ctx, cellText, colWidth - 4);
      var cellCenterX = Math.round(tableLeft + timeColWidth + (c + 0.5) * colWidth);
      fillTextEPD(ctx, cellText, cellCenterX, centerY, cellColor);
    }
    y += rowHeight;
  }
  ctx.textBaseline = 'alphabetic';
}

function saveScheduleDraft() {

}
function loadScheduleDraft() {

    var draft = JSON.parse(raw);

function loadScheduleFromData(data) {

function escapeCSVCell(s) {
  s = String(s == null ? '' : s);
  if (/[",\r\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
  return s;
}

function parseCSVLine(line) {
  var out = [];
  var i = 0;
  while (i < line.length) {
    if (line[i] === '"') {
      var end = i + 1;
      var s = '';
      while (end < line.length) {
        if (line[end] === '"') {
          if (line[end + 1] === '"') { s += '"'; end += 2; continue; }
          break;
        }
        s += line[end++];
      }
      out.push(s);
      i = end + 1;
    } else {
      var j = i;
      while (j < line.length && line[j] !== ',') j++;
      out.push(line.slice(i, j).trim());
      i = j + 1;
    }
  }
  return out;
}

function exportScheduleToCSV() {
  var data = getScheduleData();
  var rows = [];
  rows.push([data.title]);
  var header = ['\u65f6\u95f4'];
  data.days.forEach(function(d) { header.push(DAY_LABELS[d] || ''); });
  rows.push(header);
  data.slots.forEach(function(slot) {
    var row = [slot.time || ''];
    (slot.cells || []).forEach(function(c) {
      var text = (typeof c === 'object' ? c.text : String(c || '')) || '';
      if (typeof c === 'object' && c.color === 'red') text += '|red';
      row.push(text);
    });
    rows.push(row);
  });
  var csv = rows.map(function(row) {
    return row.map(escapeCSVCell).join(',');
  }).join('\r\n');
  var blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (data.title || 'schedule') + '.csv';
  a.click();
  URL.revokeObjectURL(a.href);
}

function importScheduleFromCSV(csvText) {
  var lines = csvText.split(/\r\n|\r|\n/).filter(function(l) { return l.length; });
  if (lines.length < 2) return;
  var row0 = parseCSVLine(lines[0]);
  var row1 = parseCSVLine(lines[1]);
  var title = (row0[0] || '').trim() || '\u8bfe\u7a0b\u8868';
  var timeColIdx = 0;
  var dayColIndices = [];
  var dayMap = { '\u5468\u4e00': 1, '\u5468\u4e8c': 2, '\u5468\u4e09': 3, '\u5468\u56db': 4, '\u5468\u4e94': 5, '\u5468\u516d': 6, '\u5468\u65e5': 7 };
  for (var i = 0; i < row1.length; i++) {
    var h = (row1[i] || '').trim();
    if (h === '\u65f6\u95f4') timeColIdx = i;
    else if (dayMap[h] != null) dayColIndices.push({ idx: i, day: dayMap[h] });
  }
  dayColIndices.sort(function(a, b) { return a.day - b.day; });
  var days = dayColIndices.map(function(x) { return x.day; });
  var slots = [];
  for (var r = 2; r < lines.length; r++) {
    var cells = parseCSVLine(lines[r]);
    var time = (cells[timeColIdx] || '').trim() || '--';
    var slotCells = [];
    dayColIndices.forEach(function(x) {
      var raw = (cells[x.idx] || '').trim();
      var color = 'black';
      if (raw.slice(-4) === '|red') { raw = raw.slice(0, -4).trim(); color = 'red'; }
      slotCells.push({ text: raw, color: color });
    });
    slots.push({ time: time, cells: slotCells });
  }
  loadScheduleFromData({ title: title, days: days.length ? days : [1, 2, 3, 4, 5], slots: slots, slotCount: slots.length });
  saveScheduleDraft();
}
function saveScheduleDraftDebounced() {
  if (saveTimeout) clearTimeout(saveTimeout);
  saveTimeout = setTimeout(saveScheduleDraft, 300);
}

function initTemplateSchedule() {
  document.querySelectorAll('.schedule-day-check input').forEach(function(cb) {
    cb.addEventListener('change', function() { buildScheduleSlotsDOM(); });

  }

  var templateModeBtn = document.getElementById('template-mode');

  var exportCsvBtn = document.getElementById('schedule-export-csv');
  if (exportCsvBtn) exportCsvBtn.addEventListener('click', exportScheduleToCSV);

  var importCsvBtn = document.getElementById('schedule-import-csv-btn');
  var importCsvInput = document.getElementById('schedule-import-csv');
  if (importCsvBtn && importCsvInput) {
    importCsvBtn.addEventListener('click', function(ev) {
      ev.preventDefault();
      ev.stopImmediatePropagation();
      importCsvInput.click();
    });
    importCsvInput.addEventListener('change', function(e) {
      e.stopPropagation();
      var f = e.target.files[0];
      if (!f) return;
      var r = new FileReader();

        setTimeout(function() { e.target.value = ''; }, 0);
      };
      r.readAsText(f, 'UTF-8');
    });
  }

  document.addEventListener('input', function(e) {
    if (e.target.closest && e.target.closest('#template-panel-inline')) saveScheduleDraftDebounced();
  });
  document.addEventListener('change', function(e) {
    if (e.target.id === 'schedule-import-csv') return;
    if (e.target.closest && e.target.closest('#template-panel-inline')) saveScheduleDraftDebounced();
  });
}

if (typeof document !== 'undefined' && document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', initTemplates);
} else {
  initTemplates();
}

// RLE-compress a byte array (same codec as EPD-nRF5-420 / device rle_decompress_from).
function rleCompress(data, maxLiteralSize = 128) {
  const input = data instanceof Uint8Array ? data : new Uint8Array(data);
  const result = [];
  let i = 0;

  while (i < input.length) {
    let runLen = 1;
    while (i + runLen < input.length && runLen < 130 && input[i + runLen] === input[i]) {
      runLen++;
    }

    if (runLen >= 3) {
      result.push(0x80 | (runLen - 3));
      result.push(input[i]);
      i += runLen;
    } else {
      const literalStart = i;
      let literalLen = 0;
      while (i < input.length && literalLen < maxLiteralSize) {
        if (i + 2 < input.length && input[i] === input[i + 1] && input[i] === input[i + 2]) {
          break;
        }
        literalLen++;
        i++;
      }
      if (literalLen === 0) {
        result.push(0x00);
        result.push(input[i++]);
      } else {
        result.push(literalLen - 1);
        for (let j = literalStart; j < literalStart + literalLen; j++) {
          result.push(input[j]);
        }
      }
    }
  }

  return new Uint8Array(result);
}

function rleCodeLen(control) {
  return (control & 0x80) ? 2 : (control + 2);
}

function rleCodeUncLen(control) {
  return (control & 0x80) ? ((control & 0x7f) + 3) : (control + 1);
}

function rleUncompressedLen(chunk) {
  let i = 0;
  let n = 0;
  const input = chunk instanceof Uint8Array ? chunk : new Uint8Array(chunk);
  while (i < input.length) {
    const c = input[i];
    n += rleCodeUncLen(c);
    i += rleCodeLen(c);
  }
  return n;
}

// RLE-compress entire plane, split on code boundaries to fit maxChunkSize.
function rleCompressMTU(data, maxChunkSize) {
  const maxLit = Math.min(maxChunkSize - 1, 128);
  const input = rleCompress(data, maxLit);
  const chunks = [];
  let i = 0;
  let start = 0;

  while (i < input.length) {
    const control = input[i];
    const codeLen = rleCodeLen(control);
    if (i - start + codeLen > maxChunkSize && i > start) {
      chunks.push(input.slice(start, i));
      start = i;
    }
    i += codeLen;
  }

  if (i > start) chunks.push(input.slice(start, i));
  return chunks;
}

/**
 * Whole-buffer RLE, packed into flash DATA packets:
 * each packet's RLE bytes ≤ maxRlePayload and uncompressed ≤ maxUnc
 * (device queue can hold maxUnc; Poem Frame uses 4×192).
 */
function rlePackFlashPackets(data, maxRlePayload, maxUnc) {
  const maxLit = Math.min(Math.max(1, maxRlePayload - 1), 128);
  const rle = rleCompress(data, maxLit);
  const packets = [];
  let i = 0;
  let uncOff = 0;

  while (i < rle.length) {
    const start = i;
    let unc = 0;
    let rleBytes = 0;
    while (i < rle.length) {
      const c = rle[i];
      const codeLen = rleCodeLen(c);
      const codeUnc = rleCodeUncLen(c);
      if (rleBytes > 0 &&
          (rleBytes + codeLen > maxRlePayload || unc + codeUnc > maxUnc)) {
        break;
      }
      if (rleBytes === 0 && codeUnc > maxUnc) {
        break;
      }
      unc += codeUnc;
      rleBytes += codeLen;
      i += codeLen;
    }
    if (rleBytes === 0) {
      /* Should not happen; avoid infinite loop. */
      i += 1;
      continue;
    }
    packets.push({
      offset: uncOff,
      rle: rle.subarray(start, i),
      unc,
    });
    uncOff += unc;
  }
  return packets;
}

  firmwareVariant = id;
  if (!imgMultiSupported) {
    setImgMultiUiVisible(true);
    addLog(`img slots: on (${id})`);
  }

function updateFirmwareVersionLog(versionText) {
  if (!versionText) return;
  const logElement = document.getElementById('log');
  if (!logElement) {
    addLog(`固件版本: ${versionText}`);
    return;
  }
  for (const node of logElement.childNodes) {
    if (!node || !node.textContent || node.textContent.indexOf('固件版本:') < 0) continue;
    for (let i = node.childNodes.length - 1; i >= 0; i--) {
      const n = node.childNodes[i];
      if (n.nodeType === 3 && n.textContent.indexOf('固件版本:') >= 0) {
        n.textContent = `固件版本: ${versionText}`;
        return;
      }
    }
  }
  addLog(`固件版本: ${versionText}`);
}

function setImgMultiUiVisible(on) {
  imgMultiSupported = !!on;
  const block = document.getElementById('imgMultiUi');
  if (block) block.hidden = !imgMultiSupported;
  document.querySelectorAll('.img-multi-only').forEach((el) => {
    el.hidden = !imgMultiSupported;
  });
  const sendSlot = document.getElementById('sendimgbutton');
  const sendDirect = document.getElementById('sendimgdirectbutton');
  if (sendSlot && sendDirect) {
    if (imgMultiSupported) {
      sendSlot.classList.add('primary');
      sendSlot.classList.remove('secondary');
      sendDirect.classList.add('secondary');
      sendDirect.classList.remove('primary');
    } else {
      sendDirect.classList.add('primary');
      sendDirect.classList.remove('secondary');
    }
  }
  if (typeof updateButtonStatus === 'function') updateButtonStatus();
}

function noteImgMultiFromFirmwareVersion(ver) {
  if (ver == null || !Number.isFinite(ver)) return;
  if (ver >= FW_IMG_MULTI_MIN || isSmallCarouselFwid(firmwareVariant)) {
    if (!imgMultiSupported) {
      setImgMultiUiVisible(true);
      addLog(`img slots: on (build ${ver})`);
    }
    scheduleImgSlotRefresh(700);
  } else if (!imgMultiSupported) {
    setImgMultiUiVisible(false);
    addLog(`img slots: off (build ${ver})`);
  }
}

function closeAppModal(result) {
  const modal = document.getElementById('appModal');
  if (!modal) return;
  modal.hidden = true;
  const resolve = appModalResolver;
  appModalResolver = null;
  if (resolve) resolve(result);
}

function appConfirm(message, title = '确认') {
  return new Promise((resolve) => {
    const modal = document.getElementById('appModal');
    if (!modal) {
      resolve(window.confirm(String(message)));
      return;
    }
    document.getElementById('appModalTitle').textContent = title;
    document.getElementById('appModalMsg').textContent = message;
    document.getElementById('appModalCancel').hidden = false;
    appModalResolver = resolve;
    modal.hidden = false;
  });
}

function appAlert(message, title = '提示') {
  return new Promise((resolve) => {
    const modal = document.getElementById('appModal');
    if (!modal) {
      window.alert(String(message));
      resolve(true);
      return;
    }
    document.getElementById('appModalTitle').textContent = title;
    document.getElementById('appModalMsg').textContent = message;
    document.getElementById('appModalCancel').hidden = true;
    appModalResolver = resolve;
    modal.hidden = false;
  });
}

function initAppModal() {
  const modal = document.getElementById('appModal');
  if (!modal) return;
  document.getElementById('appModalOk').onclick = () => closeAppModal(true);
  document.getElementById('appModalCancel').onclick = () => closeAppModal(false);
  modal.querySelectorAll('[data-modal-dismiss]').forEach((el) => {
    el.addEventListener('click', () => closeAppModal(false));
  });
}

function epdIsBwPanel() {
  if (firmwareVariant === 'epd213bw') return true;
  const id = deviceInfo && deviceInfo.modelId;
  if (id === 10 || id === 11) return true;
  const drv = document.getElementById('epddriver');
  const v = drv && String(drv.value).toLowerCase();
  return v === '0a' || v === '0b';
}

  const wait = epdIsBwPanel() ? '约 1 秒' : '约 10–15 秒';
  return (prefix || '墨水屏刷新中') + '（' + wait + '）…';
}

function showDebugCalendar() {
  debugCalendarCurrentDate = new Date();
  debugCalendarSelectedDate = new Date();
  updateCalendarDisplay();
  document.getElementById('debugCalendarModal').style.display = 'flex';
}

function closeDebugCalendar() {
  document.getElementById('debugCalendarModal').style.display = 'none';
}

function changeMonth(direction) {
  debugCalendarCurrentDate.setMonth(debugCalendarCurrentDate.getMonth() + direction);
  updateCalendarDisplay();
}

function updateCalendarDisplay() {
  const monthNames = ['一月', '二月', '三月', '四月', '五月', '六月',
                     '七月', '八月', '九月', '十月', '十一月', '十二月'];
  
  // Update month/year header
  document.getElementById('currentMonthYear').textContent = 
    `${debugCalendarCurrentDate.getFullYear()}年 ${monthNames[debugCalendarCurrentDate.getMonth()]}`;
  
  // Generate calendar days
  const calendarDays = document.getElementById('calendarDays');
  calendarDays.innerHTML = '';
  
  const year = debugCalendarCurrentDate.getFullYear();
  const month = debugCalendarCurrentDate.getMonth();
  const today = new Date();
  
  // Get first day of month and number of days
  const firstDay = new Date(year, month, 1);
  const lastDay = new Date(year, month + 1, 0);
  const daysInMonth = lastDay.getDate();
  const startDayOfWeek = firstDay.getDay();
  
  // Add empty cells for days before the first day of the month
  for (let i = 0; i < startDayOfWeek; i++) {
    const prevMonth = new Date(year, month, -startDayOfWeek + i + 1);
    const dayElement = createDayElement(prevMonth.getDate(), true, false, false);
    calendarDays.appendChild(dayElement);
  }
  
  // Add days of the current month
  for (let day = 1; day <= daysInMonth; day++) {
    const currentDate = new Date(year, month, day);
    const isToday = currentDate.toDateString() === today.toDateString();
    const isSelected = currentDate.toDateString() === debugCalendarSelectedDate.toDateString();
    
    const dayElement = createDayElement(day, false, isToday, isSelected);
    dayElement.onclick = () => selectDate(currentDate);
    calendarDays.appendChild(dayElement);
  }
  
  // Add empty cells for days after the last day of the month
  const remainingCells = 42 - (startDayOfWeek + daysInMonth); // 6 weeks * 7 days
  for (let i = 1; i <= remainingCells; i++) {
    const nextMonth = new Date(year, month + 1, i);
    const dayElement = createDayElement(nextMonth.getDate(), true, false, false);
    calendarDays.appendChild(dayElement);
  }
}

function createDayElement(day, isOtherMonth, isToday, isSelected) {
  const dayElement = document.createElement('div');
  dayElement.className = 'calendar-day';
  dayElement.textContent = day;
  
  if (isOtherMonth) {
    dayElement.classList.add('other-month');
  }
  if (isToday) {
    dayElement.classList.add('today');
  }
  if (isSelected) {
    dayElement.classList.add('selected');
  }
  
  return dayElement;
}

function selectDate(date) {
  debugCalendarSelectedDate = new Date(date);
  updateCalendarDisplay();
}

async function syncCustomDate() {
  // Create a new date with the selected date but current time
  const now = new Date();
  const customDate = new Date(
    debugCalendarSelectedDate.getFullYear(),
    debugCalendarSelectedDate.getMonth(),
    debugCalendarSelectedDate.getDate(),
    now.getHours(),
    now.getMinutes(),
    now.getSeconds()
  );
  
  const timestamp = customDate.getTime() / 1000;
  const data = new Uint8Array([
    (timestamp >> 24) & 0xFF,
    (timestamp >> 16) & 0xFF,
    (timestamp >> 8) & 0xFF,
    timestamp & 0xFF,
    -(new Date().getTimezoneOffset() / 60),
    1 // Calendar mode
  ]);
  
  if(await write(EpdCmd.SET_TIME, data)) {
    addLog(`调试日期已同步：${customDate.toLocaleString()}`);
    closeDebugCalendar();
  }
}

function hex2bytes(hex) {
  for (var bytes = [], c = 0; c < hex.length; c += 2)
    bytes.push(parseInt(hex.substr(c, 2), 16));
  return new Uint8Array(bytes);
}

function bytes2hex(data) {
  return new Uint8Array(data).reduce(
    function (memo, i) {
      return memo + ("0" + i.toString(16)).slice(-2);
    }, "");
}

function intToHex(intIn) {
  let stringOut = ("0000" + intIn.toString(16)).substr(-4)
  return stringOut.substring(2, 4) + stringOut.substring(0, 2);
}

async function write(cmd, data, withResponse = true) {
  if (!epdCharacteristic) {
    addLog("服务不可用，请检查蓝牙连接");
    return false;
  }
  const run = async () => {
    let payload = [cmd];
    if (data) {
      if (typeof data == 'string') data = hex2bytes(data);
      if (data instanceof Uint8Array) data = Array.from(data);
      payload.push(...data)
    }
    /* Do not log image/flash chunks — DOM hex dumps stall BLE writes. */
    if (cmd !== EpdCmd.FLASH_DATA && cmd !== EpdCmd.WRITE_IMG) {
      addLog(bytes2hex(payload), '⇑');
    }
    const writeTimeoutMs = (cmd === EpdCmd.FLASH_DATA)
      ? (isAppleWebBle ? 12000 : 8000)
      : 15000;
    let timer = null;
    try {
      const writePromise = withResponse
        ? epdCharacteristic.writeValueWithResponse(Uint8Array.from(payload))
        : epdCharacteristic.writeValueWithoutResponse(Uint8Array.from(payload));
      await Promise.race([
        writePromise,
        new Promise((_, reject) => {
          timer = setTimeout(() => {
            reject(new Error(`GATT write 超时 ${writeTimeoutMs}ms cmd=0x${cmd.toString(16)}`));
          }, writeTimeoutMs);
        }),
      ]);
    } catch (e) {
      console.error(e);
      if (e.message) addLog("write: " + e.message);
      return false;
    } finally {
      if (timer) clearTimeout(timer);
    }
    return true;
  };
  const p = gattWriteChain.then(run, run);
  gattWriteChain = p.then(() => undefined, () => undefined);
  return p;
}

function attPayloadMtu() {
  const mtuEl = document.getElementById('mtusize');
  const inputMtu = parseInt(mtuEl && mtuEl.value, 10);
  return Math.max(20, negotiatedMaxDataLen | 0, Number.isFinite(inputMtu) ? inputMtu : 0);
}

async function gattWriteBytes(bytes, withResponse) {
  if (!epdCharacteristic) {
    addLog("服务不可用，请检查蓝牙连接");
    return false;
  }
  const run = async () => {
    try {
      if (withResponse) {
        await epdCharacteristic.writeValueWithResponse(bytes);
      } else {
        await epdCharacteristic.writeValueWithoutResponse(bytes);
      }
      return true;
    } catch (e) {
      if (!withResponse) {
        try {
          await sleepMs(8);
          await epdCharacteristic.writeValueWithoutResponse(bytes);
          return true;
        } catch (_) {
          try {
            await epdCharacteristic.writeValueWithResponse(bytes);
            return true;
          } catch (e2) {
            console.error(e2);
            if (e2.message) addLog("write: " + e2.message);
            return false;
          }
        }
      }
      console.error(e);
      if (e.message) addLog("write: " + e.message);
      return false;
    }
  };
  const p = gattWriteChain.then(run, run);
  gattWriteChain = p.then(() => undefined, () => undefined);
  return p;
}

function writeImageFlag(step, begin, useRle) {
  /* Firmware hi-nibble: 0=begin, 1=begin+RLE, E=cont+RLE, F=cont; lo 0x0F=bw. */
  const lo = (step === 'bw') ? 0x0F : 0x00;
  const hi = useRle ? (begin ? 0x10 : 0xE0) : (begin ? 0x00 : 0xF0);
  return hi | lo;
}

async function writeImage(data, step = 'bw') {
  const mtu = attPayloadMtu();
  const chunkSize = Math.max(1, mtu - 2);
  const interleavedCount = parseInt(document.getElementById('interleavedcount').value, 10) || 50;
  let noReplyCount = interleavedCount;
  const stepText = step === 'bw' ? '黑白' : '颜色';
  const rleChunks = rleSupport ? rleCompressMTU(data, chunkSize) : null;
  const rleLength = rleChunks ? rleChunks.reduce((total, chunk) => total + chunk.length, 0) : data.length;
  const useRle = rleSupport && rleLength < data.length;
  const totalChunks = useRle ? rleChunks.length : Math.ceil(data.length / chunkSize);

  for (let i = 0; i < totalChunks; i++) {
    const raw = useRle ? rleChunks[i] : data.slice(i * chunkSize, i * chunkSize + chunkSize);
    const chunk = raw instanceof Uint8Array ? raw : Uint8Array.from(raw);
    if (i === 0 || i === totalChunks - 1 || (i % 8) === 0) {
      const currentTime = (new Date().getTime() - startTime) / 1000.0;
      setStatus(`${stepText}块: ${i + 1}/${totalChunks}${useRle ? ' RLE' : ''}, 总用时: ${currentTime}s`);
    }
    const pkt = new Uint8Array(2 + chunk.length);
    pkt[0] = EpdCmd.WRITE_IMG;
    pkt[1] = writeImageFlag(step, i === 0, useRle);
    pkt.set(chunk, 2);
    /* First chunk (begin) must ACK: firmware may hardware-reset the panel after sleep. */
    const needAck = (i === 0) || (i === totalChunks - 1) || (noReplyCount <= 0);
    if (!await gattWriteBytes(pkt, needAck)) return false;
    if (needAck) {
      noReplyCount = interleavedCount;
    } else {
      noReplyCount--;
    }
  }
  return true;
}

function setPinsPayload() {
  let pins = document.getElementById("epdpins").value;
  if (typeof pins === 'string') pins = hex2bytes(pins || '');
  const bytes = Array.from(pins);
  while (bytes.length < 8) bytes.push(0xFF);
  const keyEl = document.getElementById("epdkeypin");
  const key = keyEl ? parseInt(keyEl.value, 10) : NaN;
  if (Number.isFinite(key) && key >= 0 && key <= 31) {
    bytes.push(key & 0xFF);
  }
  return bytes;
}

async function setDriver() {
  await write(EpdCmd.SET_PINS, setPinsPayload());
  await write(EpdCmd.INIT, document.getElementById("epddriver").value);
  if (typeof imgRefreshInfo === 'function') {
    try { await imgRefreshInfo({ quiet: true }); } catch (_) {}
  }
}

function u32le(n) {
  return [n & 0xFF, (n >> 8) & 0xFF, (n >> 16) & 0xFF, (n >> 24) & 0xFF];
}

async function sleepMs(ms) {
  await new Promise((r) => setTimeout(r, ms));
}
