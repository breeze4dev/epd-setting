function flashChunkSizeFromMtu(maxDataLen) {
  const mtu = Math.max(20, maxDataLen | 0);
  return Math.min(192, Math.max(8, mtu - 5));
}

async function ensureFlashMtuReady(timeoutMs = 8000) {
  const t0 = Date.now();
  while (negotiatedMaxDataLen < 20) {
    if (Date.now() - t0 > timeoutMs) break;
    await sleepMs(50);
  }
  if (negotiatedMaxDataLen < 20) {
    negotiatedMaxDataLen = 20;
    const mtuEl = document.getElementById('mtusize');
    if (mtuEl) mtuEl.value = 20;
    addLog('未收到 mtu=，按安全值 20 传输（Mac 常见）');
    return negotiatedMaxDataLen;
  }
  if (isAppleWebBle && negotiatedMaxDataLen <= 20) {
    const t1 = Date.now();
    while (negotiatedMaxDataLen <= 20 && Date.now() - t1 < 3500) {
      await sleepMs(50);
    }
    if (negotiatedMaxDataLen > 20) {
      addLog(`MTU 协商完成: ${negotiatedMaxDataLen}`);
    }
  }
  return negotiatedMaxDataLen;
}

let imgSlotCount = 0;
let imgSlotMaskBytes = new Uint8Array(16); /* LE bitset; bit i = slot i occupied */
let imgSlotStride = 0;
let imgSelectedSlotIdx = 0;
let imgSlotUiShow = 1; /* visible slots in UI (compact: hide trailing empties) */
let imgSlotPayloadCache = {};
let imgReadBuf = null;
let imgReadExpect = 0;
let imgReadResolve = null;
let imgReadReject = null;
let imgReadBusy = false;
let imgReadProgressLabel = '读取图片';
let imgCarouselDeviceMin = 0;
let imgCarouselDeviceMode = 0; /* 0=random, 1=sequential */
let xferProgressLast = { send: -1 };
let flashNotifyWait = null;
let flashBusyFlag = false;
let flashAckCredits = 0;
let flashAckError = null;

function imgMaskEnsure(n) {
  const need = Math.max(1, Math.ceil((n || imgSlotCount || 1) / 8));
  if (imgSlotMaskBytes.length < need) {
    const nb = new Uint8Array(need);
    nb.set(imgSlotMaskBytes);
    imgSlotMaskBytes = nb;
  }
}

function imgMaskGet(slot) {
  const bi = slot >> 3;
  if (bi >= imgSlotMaskBytes.length) return false;
  return (imgSlotMaskBytes[bi] & (1 << (slot & 7))) !== 0;
}

function imgSlotNo(slot) {
  return (slot | 0) + 1;
}

function imgMaskSet(slot, on) {
  imgMaskEnsure(slot + 1);
  const bi = slot >> 3;
  const bit = 1 << (slot & 7);
  if (on) imgSlotMaskBytes[bi] |= bit;
  else imgSlotMaskBytes[bi] &= ~bit;
}

function imgMaskParseHex(hex, count) {
  const h = String(hex || '').replace(/[^0-9a-fA-F]/g, '');
  const nbytes = Math.max(1, Math.ceil((count || 1) / 8));
  const out = new Uint8Array(nbytes);
  for (let i = 0; i < nbytes; i++) {
    const s = h.substr(i * 2, 2);
    out[i] = s.length ? (parseInt(s, 16) || 0) : 0;
  }
  imgSlotMaskBytes = out;
}

function imgMaskUsedSlots() {
  return [...Array(imgSlotCount).keys()].filter((i) => imgMaskGet(i));
}

function imgSlotMaxUsed() {
  let max = -1;
  for (let i = 0; i < imgSlotCount; i++) {
    if (imgMaskGet(i) || imgSlotPayloadCache[i]) max = i;
  }
  return max;
}

/** Compact UI: show through highest occupied slot (min 1); trailing empties hidden until "新增槽位". */
function imgSlotVisibleCount() {
  if (imgSlotCount <= 0) return 0;
  const base = Math.max(1, imgSlotMaxUsed() + 1);
  let n = Math.max(base, imgSlotUiShow | 0);
  if (imgSelectedSlotIdx >= 0) {
    n = Math.max(n, Math.min(imgSlotCount, imgSelectedSlotIdx + 1));
  }
  return Math.min(imgSlotCount, Math.max(1, n));
}

function imgSyncSlotUiShow() {
  imgSlotUiShow = imgSlotVisibleCount();
}

/** Hide trailing empty slots after occupancy changes; keep selection visible. */
function imgCollapseTrailingEmpty() {
  if (imgSlotCount <= 0) {
    imgSlotUiShow = 1;
    return;
  }
  imgSlotUiShow = Math.max(1, imgSlotMaxUsed() + 1);
  if (imgSelectedSlotIdx >= 0) {
    imgSlotUiShow = Math.max(imgSlotUiShow, Math.min(imgSlotCount, imgSelectedSlotIdx + 1));
  }
}

function imgAddEmptySlot() {
  if (imgSlotCount <= 0) {
    if (typeof appAlert === 'function') appAlert('请先连接设备并刷新槽位', '提示');
    return;
  }
  const vis = imgSlotVisibleCount();
  if (vis >= imgSlotCount) {
    if (typeof appAlert === 'function') appAlert(`已达最大槽位数（${imgSlotCount}）`, '提示');
    return;
  }
  imgSlotUiShow = vis + 1;
  imgSelectSlot(vis);
  imgUpdateSlotSelect();
}

function resetImgSlotUi() {
  imgSlotCount = 0;
  imgSlotMaskBytes = new Uint8Array(16);
  imgSlotStride = 0;
  imgSelectedSlotIdx = 0;
  imgSlotUiShow = 1;
  imgSlotPayloadCache = {};
  imgReadBuf = null;
  imgReadExpect = 0;
  imgReadResolve = null;
  imgReadReject = null;
  imgReadBusy = false;
  imgReadProgressLabel = '读取图片';
  imgCarouselDeviceMin = 0;
  imgCarouselDeviceMode = 0;
  flashAckCredits = 0;
  flashAckError = null;
  flashBusyFlag = false;
  xferProgressLast = { send: -1 };
  const grid = document.getElementById('imgSlotGrid');
  if (grid) grid.innerHTML = '';
  if (typeof imgUpdateSlotSelect === 'function') imgUpdateSlotSelect();
  const hint = document.getElementById('imgSlotHint');
  if (hint) hint.textContent = '连接设备后点「刷新槽位」获取数量';
  const car = document.getElementById('imgCarouselVal');
  if (car) car.value = '0';
  imgCarouselApplyDeviceMode(0);
  clearTransferProgress('未连接');
}

function imgComputeStride(width, height, planes) {
  const p = planes == null ? imgSlotPlanes() : planes;
  const plane = Math.ceil(width / 8) * height;
  const raw = 16 + plane * p;
  return Math.ceil(raw / 4096) * 4096;
}

function imgEffectiveStride() {
  if (imgSlotStride > 0) return imgSlotStride;
  const def = imgDefaultPanel();
  const w = deviceInfo.width || def.w;
  const h = deviceInfo.height || def.h;
  return imgComputeStride(w, h);
}

function imgSelectedSlot() {
  return imgSelectedSlotIdx | 0;
}

function imgCarouselUnit() {
  const el = document.querySelector('input[name="imgCarUnit"]:checked');
  return el ? el.value : 'min';
}

function imgCarouselApplyDeviceMinutes(mins) {
  imgCarouselDeviceMin = mins | 0;
  const el = document.getElementById('imgCarouselVal');
  if (!el) return;
  if (imgCarouselUnit() === 'hour') {
    el.max = 4;
    el.value = (mins <= 0) ? '0' : String(Math.max(1, Math.round(mins / 60)));
  } else {
    el.max = 240;
    el.value = String(mins);
  }
}

function imgCarouselUnitChanged() {
  imgCarouselApplyDeviceMinutes(imgCarouselDeviceMin);
}

function imgCarouselMode() {
  const el = document.querySelector('input[name="imgCarMode"]:checked');
  const v = el ? parseInt(el.value, 10) : 0;
  return v === 1 ? 1 : 0;
}

function imgCarouselApplyDeviceMode(mode) {
  imgCarouselDeviceMode = (mode === 1) ? 1 : 0;
  const radios = document.querySelectorAll('input[name="imgCarMode"]');
  radios.forEach((r) => {
    r.checked = (parseInt(r.value, 10) === imgCarouselDeviceMode);
  });
}

function imgClearSlotThumb(canvasEl) {
  if (!canvasEl) return;
  const c = canvasEl.getContext('2d');
  if (!c) return;
  c.fillStyle = '#e8ece9';
  c.fillRect(0, 0, canvasEl.width, canvasEl.height);
  c.strokeStyle = 'rgba(22,24,20,0.12)';
  c.strokeRect(0.5, 0.5, canvasEl.width - 1, canvasEl.height - 1);
}

function paintBwrPayload(payload, w, h, targetCanvas) {
  const plane = Math.ceil(w / 8) * h;
  const planes = (payload && payload.length >= plane * 2) ? 2 : 1;
  if (!targetCanvas || !payload || payload.length < plane * planes) return false;
  const tctx = targetCanvas.getContext('2d');
  if (!tctx) return false;
  const portrait = (w < h);
  const cw = portrait ? h : w;
  const ch = portrait ? w : h;
  targetCanvas.width = cw;
  targetCanvas.height = ch;
  const img = tctx.createImageData(cw, ch);
  const bw = payload.subarray(0, plane);
  const rw = (planes >= 2) ? payload.subarray(plane, plane * 2) : null;
  const wb = Math.ceil(w / 8);
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const bi = y * wb + (x >> 3);
      const bit = 0x80 >> (x & 7);
      const black = (bw[bi] & bit) === 0;
      const red = rw ? ((rw[bi] & bit) === 0) : false;
      let dx = x, dy = y;
      if (portrait) {
        dx = h - 1 - y;
        dy = x;
      }
      const o = (dy * cw + dx) * 4;
      if (red) {
        img.data[o] = 255; img.data[o + 1] = 0; img.data[o + 2] = 0; img.data[o + 3] = 255;
      } else if (black) {
        img.data[o] = 0; img.data[o + 1] = 0; img.data[o + 2] = 0; img.data[o + 3] = 255;
      } else {
        img.data[o] = 255; img.data[o + 1] = 255; img.data[o + 2] = 255; img.data[o + 3] = 255;
      }
    }
  }
  tctx.putImageData(img, 0, 0);
  return true;
}

function imgSelectSlot(slot) {
  imgSelectedSlotIdx = slot;
  if (imgSlotCount > 0) {
    imgSlotUiShow = Math.max(imgSlotUiShow | 0, Math.min(imgSlotCount, slot + 1));
  }
  document.querySelectorAll('.img-slot[data-slot]').forEach((el) => {
    const i = parseInt(el.dataset.slot, 10);
    el.classList.toggle('is-selected', i === slot);
    el.setAttribute('aria-selected', i === slot ? 'true' : 'false');
  });
}

function imgUpdateSlotSelect() {
  const grid = document.getElementById('imgSlotGrid');
  const hint = document.getElementById('imgSlotHint');
  if (!grid) return;
  if (imgSlotCount <= 0) {
    grid.innerHTML = '';
    imgSlotUiShow = 1;
    if (hint) hint.textContent = '连接设备后点「刷新槽位」获取数量';
    return;
  }
  if (imgSelectedSlotIdx >= imgSlotCount) imgSelectedSlotIdx = 0;
  imgSyncSlotUiShow();
  const visible = imgSlotVisibleCount();
  grid.innerHTML = '';
  for (let i = 0; i < visible; i++) {
    const used = imgMaskGet(i) || !!imgSlotPayloadCache[i];
    if (used) imgMaskSet(i, true);

    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'img-slot' + (i === imgSelectedSlotIdx ? ' is-selected' : '');
    btn.dataset.slot = String(i);
    btn.setAttribute('role', 'option');
    btn.setAttribute('aria-selected', i === imgSelectedSlotIdx ? 'true' : 'false');
    btn.title = used ? `槽位 ${imgSlotNo(i)}（有图）` : `槽位 ${imgSlotNo(i)}（空）`;
    btn.onclick = () => imgSelectSlot(i);

    const thumb = document.createElement('canvas');
    thumb.className = 'img-slot-thumb';
    thumb.width = 148;
    thumb.height = 76;
    thumb.setAttribute('aria-hidden', 'true');

    const meta = document.createElement('span');
    meta.className = 'img-slot-meta';
    const label = document.createElement('span');
    label.className = 'img-slot-label';
    label.textContent = `槽${imgSlotNo(i)}`;
    const dot = document.createElement('span');
    dot.className = 'img-slot-dot' + (used ? ' is-filled' : '');
    dot.title = used ? '有图' : '空';
    meta.appendChild(label);
    meta.appendChild(dot);
    btn.appendChild(thumb);
    btn.appendChild(meta);
    grid.appendChild(btn);

    const cached = imgSlotPayloadCache[i];
    if (cached) {
      const def = imgDefaultPanel();
      const w = deviceInfo.width || def.w;
      const h = deviceInfo.height || def.h;
      paintBwrPayload(cached, w, h, thumb);
    } else {
      imgClearSlotThumb(thumb);
    }
  }
  if (visible < imgSlotCount) {
    const add = document.createElement('button');
    add.type = 'button';
    add.className = 'img-slot img-slot-add';
    add.title = `新增空槽位（还可 ${imgSlotCount - visible} 个）`;
    add.setAttribute('aria-label', '新增槽位');
    add.onclick = () => imgAddEmptySlot();
    const plus = document.createElement('span');
    plus.className = 'img-slot-add-plus';
    plus.textContent = '+';
    const addLabel = document.createElement('span');
    addLabel.className = 'img-slot-add-label';
    addLabel.textContent = '新增槽位';
    add.appendChild(plus);
    add.appendChild(addLabel);
    grid.appendChild(add);
  }
  if (hint) {
    const used = imgMaskUsedSlots().length;
    hint.textContent = `显示 ${visible}/${imgSlotCount} 槽，已占用 ${used}；点「新增槽位」后会扩展更多槽位`
      + (visible < imgSlotCount ? '' : '（已满）');
  }
}

function applyImgInfoNotify(msg) {
  if (!/^img=\d+,/.test(msg)) return false;
  if (!imgMultiSupported) {
    setImgMultiUiVisible(true);
    addLog('设备响应槽位信息：启用多图界面');
  }
  const body = msg.slice(4);
  const parts = body.split(',');
  imgSlotCount = parseInt(parts[0], 10) || 0;
  imgMaskParseHex(parts[1] || '00', imgSlotCount);
  for (const k of Object.keys(imgSlotPayloadCache)) {
    const i = parseInt(k, 10);
    if (Number.isFinite(i) && i >= 0 && i < imgSlotCount) imgMaskSet(i, true);
  }
  if (parts.length >= 5) {
    const st = parseInt(parts[4], 10);
    if (Number.isFinite(st) && st > 0) imgSlotStride = st;
  }
  const car = parseInt(parts[2], 10) || 0;
  imgCarouselApplyDeviceMinutes(car);
  if (parts.length >= 6) {
    imgCarouselApplyDeviceMode(parseInt(parts[5], 10) || 0);
  }
  if (imgSelectedSlotIdx >= imgSlotCount) imgSelectedSlotIdx = 0;
  imgCollapseTrailingEmpty();
  imgUpdateSlotSelect();
  return true;
}

async function imgRefreshInfo(opts = null) {
  if (!checkBluetoothConnection()) return;
  if (flashOpActive) {
    if (!(opts && opts.quiet)) addLog('传输进行中，跳过槽位刷新');
    return;
  }
  const keepSlot = (opts && opts.keepSlot != null) ? opts.keepSlot : imgSelectedSlotIdx;
  const quiet = !!(opts && opts.quiet);
  const forceSlot = (opts && opts.forceSlot != null) ? opts.forceSlot : -1;
  if (!quiet) setStatus('刷新槽位状态…');
  const p = waitFlashNotify('img=', quiet ? 8000 : 12000, null, {
    match: (msg) => /^img=\d+,/.test(msg),
    ignore: (msg) =>
      msg === 'img=ok' || msg === 'img=busy' || msg === 'img=err' ||
      msg === 'img=del' || msg === 'img=empty' || msg === 'img=car' ||
      msg === 'img=queued',
  });
  if (!await write(EpdCmd.IMG_INFO, null, true)) {
    if (!quiet) setStatus('IMG_INFO 发送失败');
    addLog('IMG_INFO 发送失败');
    return;
  }
  try {
    const msg = await p;
    applyImgInfoNotify(msg);
    if (forceSlot >= 0) {
      imgMaskSet(forceSlot, true);
      imgUpdateSlotSelect();
    }
    if (Number.isFinite(keepSlot) && keepSlot >= 0 && keepSlot < imgSlotCount) {
      imgSelectedSlotIdx = keepSlot;
      imgUpdateSlotSelect();
    }
    addLog(`图片槽位：${msg}`);
    const used = imgMaskUsedSlots().length;
    if (!quiet) setStatus(`槽位 ${used}/${imgSlotCount} 有图`);
  } catch (e) {
    if (String(e.message || e) === 'cancelled') return;
    if (forceSlot >= 0) {
      imgMaskSet(forceSlot, true);
      imgUpdateSlotSelect();
    }
    if (!quiet) setStatus('刷新槽位失败');
    addLog(e.message || String(e));
  }
}

async function imgShowSlot() {
  if (!checkBluetoothConnection()) return;
  const slot = imgSelectedSlot();
  setStatus(`显示槽位 ${imgSlotNo(slot)}`);
  showToast(`正在刷屏显示槽位 ${imgSlotNo(slot)}…`, 'info', 3500);
  setEpdBusy(true, epdRefreshBusyHint(`正在刷屏显示槽位 ${imgSlotNo(slot)}`));
  const deadline = Date.now() + 120000;
  let attempt = 0;
  try {
    while (Date.now() < deadline) {
      attempt++;
      const p = waitFlashNotify('img=ok', 120000, null, {
        match: (msg) =>
          msg === 'img=ok' || msg === 'img=empty' || msg === 'img=err' || msg === 'img=busy',
        ignore: (msg) => msg === 'img=queued' || /^img=\d+,/.test(msg),
      });
      if (!await write(EpdCmd.IMG_SHOW, [slot], true)) {
        setStatus('显示命令发送失败');
        showToast('显示命令发送失败', 'err');
        return;
      }
      try {
        const msg = await p;
        if (msg === 'img=busy') {
          setStatus(`显示槽位 ${imgSlotNo(slot)}（设备忙，请稍候）`);
          showToast('屏幕刷新中，已排队等待…', 'warn', 2500);
          if (attempt === 1 || (attempt % 3) === 0) addLog('设备忙，等待屏幕空闲…');
          await sleepMs(800);
          continue;
        }
        addLog(msg);
        if (msg === 'img=ok') {
          setStatus(`槽位 ${imgSlotNo(slot)} 已显示`);
          showToast('屏幕刷新完成，可继续操作', 'ok');
        } else {
          setStatus(msg);
          showToast(msg, 'warn');
        }
        return;
      } catch (e) {
        if (String(e.message || e) === 'cancelled') return;
        setStatus('显示超时');
        addLog(e.message || String(e));
        showToast('显示超时：请确认刷屏是否完成', 'err', 4200);
        return;
      }
    }
    setStatus('显示失败：设备持续忙碌');
    addLog('显示此槽失败：设备持续忙碌');
    showToast('设备持续忙碌，显示失败', 'err');
  } finally {
    setEpdBusy(false);
  }
}

async function imgDeleteSlot() {
  if (!checkBluetoothConnection()) return;
  const slot = imgSelectedSlot();
  if (!await appConfirm(`确定删除槽位 ${imgSlotNo(slot)} 的图片？此操作不可恢复。`, '删除图片')) return;
  setStatus(`删除槽位 ${imgSlotNo(slot)}…`);
  const p = waitFlashNotify('img=', 30000, null, {
    match: (msg) => msg === 'img=del' || msg === 'img=err' || msg === 'img=busy',
  });
  if (!await write(EpdCmd.IMG_DELETE, [slot], true)) {
    setStatus('删除命令发送失败');
    return;
  }
  try {
    addLog(await p);
    delete imgSlotPayloadCache[slot];
    imgMaskSet(slot, false);
    imgCollapseTrailingEmpty();
    await imgRefreshInfo({ keepSlot: slot, quiet: true });
    setStatus(`槽位 ${imgSlotNo(slot)} 已删除`);
    imgUpdateSlotSelect();
  } catch (e) {
    setStatus('删除失败');
    addLog(e.message || String(e));
  }
}

async function imgClearAllSlots() {
  if (!checkBluetoothConnection()) return;
  if (imgSlotCount <= 0) await imgRefreshInfo();
  const used = imgMaskUsedSlots();
  if (used.length === 0) {
    await appAlert('当前没有已占用的图片槽位', '清空全部');
    return;
  }
  if (!await appConfirm(`确定清空全部 ${used.length} 个已占用槽位的图片？此操作不可恢复。`, '清空全部')) return;
  let i = 0;
  setTransferProgress(0, '清空槽位…', { reset: true });
  for (const slot of used) {
    i++;
    setTransferProgress((i / used.length) * 100, `清空槽位 ${imgSlotNo(slot)} (${i}/${used.length})…`);
    const p = waitFlashNotify('img=', 30000, null, {
      match: (msg) => msg === 'img=del' || msg === 'img=err' || msg === 'img=busy',
    });
    if (!await write(EpdCmd.IMG_DELETE, [slot], true)) {
      addLog(`删除槽位 ${imgSlotNo(slot)} 失败`);
      break;
    }
    try {
      addLog(await p);
      delete imgSlotPayloadCache[slot];
      imgMaskSet(slot, false);
    } catch (e) {
      addLog(e.message || String(e));
      break;
    }
  }
  imgSelectedSlotIdx = 0;
  imgSlotUiShow = 1;
  await imgRefreshInfo({ keepSlot: 0, quiet: true });
  clearTransferProgress('已清空全部槽位');
}

async function imgSetCarousel() {
  if (!checkBluetoothConnection()) return;
  if (!imgMultiSupported) {
    await appAlert('当前固件不支持图片轮播，请升级固件。', '不支持');
    return;
  }
  const raw = parseInt(document.getElementById('imgCarouselVal')?.value, 10);
  const v = Number.isFinite(raw) ? raw : 0;
  let mins = 0;
  if (v > 0) {
    mins = (imgCarouselUnit() === 'hour') ? (v * 60) : v;
  }
  if (mins !== 0 && mins < 5) {
    await appAlert('轮播间隔最小为 5 分钟（填 0 可关闭）', '值无效');
    return;
  }
  if (mins > 240) mins = 240;
  const mode = imgCarouselMode();
  if (mins !== 0) {
    const used = imgMaskUsedSlots().length;
    if (used < 2) await appAlert('至少需要 2 个已占用槽位才会自动换图', '提示');
  }
  imgCarouselDeviceMin = mins;
  imgCarouselDeviceMode = mode;
  const p = waitFlashNotify('img=car', 5000);
  if (!await write(EpdCmd.IMG_CAROUSEL, [mins, mode], true)) {
    await appAlert('设置命令发送失败', '设置失败');
    return;
  }
  try {
    addLog(await p);
    imgCarouselApplyDeviceMinutes(mins);
    imgCarouselApplyDeviceMode(mode);
    const modeText = mode === 1 ? '顺序' : '随机';
    if (mins !== 0) {
      /* Device also switches mode; sync host-side SET_TIME for consistency. */
      await syncTime(0);
      setEpdBusyForRefresh(epdRefreshBusyHint('已切图片模式，正在刷屏'));
      await appAlert(
        `轮播已设为 ${mins} 分钟，${modeText}播放\n已自动切换到图片模式`,
        '设置成功'
      );
    } else {
      await appAlert('已关闭图片轮播', '设置成功');
    }
  } catch (e) {
    addLog(e.message || String(e));
    await appAlert(e.message || String(e), '设置失败');
  }
}

function onImgBinaryChunk(data) {
  if (!imgReadBuf || data.length < 5) return;
  const off = data[3] | (data[4] << 8);
  const chunk = data.slice(5);
  if (off + chunk.length > imgReadBuf.length) return;
  imgReadBuf.set(chunk, off);
  if (imgReadExpect > 0) {
    const done = Math.min(imgReadExpect, off + chunk.length);
    const pct = (done / imgReadExpect) * 100;
    setTransferProgress(pct, `${imgReadProgressLabel} ${done}/${imgReadExpect} (${pct.toFixed(0)}%)`);
  }
  if (off + chunk.length >= imgReadExpect && imgReadResolve) {
    const r = imgReadResolve;
    imgReadResolve = null;
    imgReadReject = null;
    r(imgReadBuf);
  }
}

function paintBwrToCanvas(payload, w, h) {
  if (!canvas) {
    addLog('画布未初始化');
    return;
  }
  if (!paintBwrPayload(payload, w, h, canvas)) {
    addLog('回读数据长度不足');
    return;
  }
  addLog(`已显示到画布 ${canvas.width}x${canvas.height}`);
}

async function imgReadSlotPayload(slot, label) {
  imgReadProgressLabel = label || `读取槽${imgSlotNo(slot)}`;
  setTransferProgress(0, `${imgReadProgressLabel}…`, { reset: true });
  const startP = waitFlashNotify('imgr=start', 10000);
  if (!await write(EpdCmd.IMG_READ, [slot], true)) {
    throw new Error(`槽${imgSlotNo(slot)}：读取命令发送失败`);
  }
  const startMsg = await startP;
  const parts = startMsg.split(',');
  imgReadExpect = parseInt(parts[2], 10) || 0;
  if (imgReadExpect <= 0) throw new Error(`槽${imgSlotNo(slot)}：回读长度无效`);
  imgReadBuf = new Uint8Array(imgReadExpect);
  setTransferProgress(0, `${imgReadProgressLabel} 0/${imgReadExpect}`, { reset: true });
  const done = new Promise((resolve, reject) => {
    imgReadResolve = resolve;
    imgReadReject = reject;
    setTimeout(() => reject(new Error(`槽${imgSlotNo(slot)}：回读超时`)), 180000);
  });
  const okP = waitFlashNotify('imgr=ok', 180000, 'imgr=err');
  const payload = await Promise.race([done, okP.then(() => imgReadBuf)]);
  await okP.catch(() => {});
  const copy = new Uint8Array(payload);
  imgSlotPayloadCache[slot] = copy;
  imgMaskSet(slot, true);
  const def = imgDefaultPanel();
  const w = deviceInfo.width || def.w;
  const h = deviceInfo.height || def.h;
  const thumb = document.querySelector(`.img-slot[data-slot="${slot}"] .img-slot-thumb`);
  if (thumb) paintBwrPayload(copy, w, h, thumb);
  imgReadBuf = null;
  imgReadResolve = null;
  imgReadReject = null;
  return copy;
}

async function imgReadSlot() {
  if (!checkBluetoothConnection()) return;
  if (imgReadBusy || flashOpActive) {
    await appAlert('请等待当前传输完成', '读取图片');
    return;
  }
  const slot = imgSelectedSlot();
  if (!imgMaskGet(slot)) {
    await appAlert(`槽位 ${imgSlotNo(slot)} 为空，无法读取`, '读取图片');
    return;
  }
  imgReadBusy = true;
  try {
    await imgReadSlotPayload(slot, `读取槽${imgSlotNo(slot)}`);
    addLog(`已读取槽位 ${imgSlotNo(slot)} 到缩略图`);
    setTransferProgress(100, `槽位 ${imgSlotNo(slot)} 读取完成`);
    setTimeout(() => clearTransferProgress(`槽位 ${imgSlotNo(slot)} 已读取`), 1200);
  } catch (e) {
    imgReadBuf = null;
    imgReadResolve = null;
    imgReadReject = null;
    clearTransferProgress('读取失败');
    addLog(e.message || String(e));
  } finally {
    imgReadBusy = false;
  }
}

async function imgReadAllSlots() {
  if (!checkBluetoothConnection()) return;
  if (imgReadBusy || flashOpActive) {
    await appAlert('请等待当前传输完成', '读取全部');
    return;
  }
  imgReadBusy = true;
  try {
    await imgRefreshInfo({ quiet: true });
    const slots = imgMaskUsedSlots();
    if (slots.length === 0) {
      await appAlert('没有已占用的图片槽位', '读取全部');
      clearTransferProgress('无图可读');
      return;
    }
    if (!await appConfirm(
      `将依次读取 ${slots.length} 个已占用槽位到缩略图，可能需要数十秒。继续？`,
      '读取全部'
    )) {
      clearTransferProgress('已取消');
      return;
    }
    addLog(`开始读取全部：${slots.length} 个槽位 [${slots.map(imgSlotNo).join(',')}]`);
    let doneCount = 0;
    for (const slot of slots) {
      await imgReadSlotPayload(slot, `读取全部 ${doneCount + 1}/${slots.length} 槽${imgSlotNo(slot)}`);
      doneCount++;
      addLog(`已读取槽位 ${imgSlotNo(slot)} (${doneCount}/${slots.length})`);
      await yieldUiPaint();
    }
    imgUpdateSlotSelect();
    setTransferProgress(100, `全部读取完成 ${doneCount}/${slots.length}`);
    setTimeout(() => clearTransferProgress(`已读取 ${doneCount} 张图`), 1500);
    await appAlert(`已读取 ${doneCount} 个槽位到缩略图`, '读取全部');
  } catch (e) {
    imgReadBuf = null;
    imgReadResolve = null;
    imgReadReject = null;
    clearTransferProgress('读取全部失败');
    addLog(e.message || String(e));
    await appAlert(e.message || String(e), '读取全部失败');
  } finally {
    imgReadBusy = false;
  }
}

async function imgShowToCanvas() {
  const slot = imgSelectedSlot();
  const payload = imgSlotPayloadCache[slot];
  if (!payload) {
    await appAlert('请先「读取图片」到当前槽位缩略图，再显示到画布', '显示到画布');
    return;
  }
  const def = imgDefaultPanel();
  const w = deviceInfo.width || def.w;
  const h = deviceInfo.height || def.h;
  paintBwrToCanvas(payload, w, h);
}

function crc32Uint8(buf) {
  let crc = 0xFFFFFFFF;
  for (let i = 0; i < buf.length; i++) {
    crc ^= buf[i];
    for (let j = 0; j < 8; j++) {
      crc = (crc >>> 1) ^ (0xEDB88320 & -(crc & 1));
    }
  }
  return (crc ^ 0xFFFFFFFF) >>> 0;
}

function buildImgSlotBlob(bwrPayload, width, height) {
  const plane = Math.ceil(width / 8) * height;
  const planes = imgSlotPlanes();
  if (bwrPayload.length !== plane * planes) {
    throw new Error(`payload ${bwrPayload.length} != ${plane * planes}`);
  }
  const hdr = new Uint8Array(16);
  hdr[0] = 0x49; hdr[1] = 0x4D; hdr[2] = 0x41; hdr[3] = 0x47;
  const crc = crc32Uint8(bwrPayload);
  hdr[4] = crc & 0xff;
  hdr[5] = (crc >>> 8) & 0xff;
  hdr[6] = (crc >>> 16) & 0xff;
  hdr[7] = (crc >>> 24) & 0xff;
  hdr[8] = width & 0xff;
  hdr[9] = (width >>> 8) & 0xff;
  hdr[10] = height & 0xff;
  hdr[11] = (height >>> 8) & 0xff;
  hdr[12] = planes;
  const stride = imgEffectiveStride();
  const need = 16 + bwrPayload.length;
  if (stride < need) throw new Error(`stride ${stride} < blob ${need}`);
  const out = new Uint8Array(stride);
  out.fill(0xFF);
  out.set(hdr, 0);
  out.set(bwrPayload, 16);
  return { blob: out, crc: crc32Uint8(out) };
}

async function prepareCanvasBwr() {
  if (!canvas || !ctx) throw new Error('画布未初始化');
  if (isCropMode()) throw new Error('请先完成图片裁剪后再发送');
  const ditherMode = document.getElementById('ditherMode').value;
  const planes = imgSlotPlanes();
  if (planes === 1) {
    if (ditherMode !== 'blackWhiteColor' && ditherMode !== 'threeColor') {
      throw new Error('2.13黑白槽位请使用双色(黑白)模式');
    }
  } else if (ditherMode !== 'threeColor') {
    throw new Error('存槽位请使用三色(黑白红)模式');
  }
  let imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const epdDriverSelect = document.getElementById('epddriver');
  const selectedOption = epdDriverSelect.options[epdDriverSelect.selectedIndex];
  const is42 = selectedOption && selectedOption.getAttribute('data-size42') === 'true';
  if (is42) {
    if (canvas.width === 300 && canvas.height === 400) {
      imageData = rotateImageDataCounterclockwise(imageData);
      addLog('4.2 画布已旋转纠正为 400x300');
    }
  } else if (canvas.width > canvas.height) {
    imageData = rotateImageDataCounterclockwise(imageData);
    addLog(`检测到横屏画布，已旋转为竖屏 ${imageData.width}x${imageData.height}`);
  }
  let processed = processImageData(imageData, ditherMode);
  if (planes === 1 && ditherMode === 'threeColor') {
    processed = processed.subarray(0, Math.floor(processed.length / 2));
  }
  return { payload: processed, width: imageData.width, height: imageData.height };
}

async function sendimgToSlotAndShow() {
  if (!checkBluetoothConnection()) return;
  if (!imgMultiSupported) {
    await appAlert('当前固件不支持多图槽位，请使用「直写屏幕」或升级固件。', '不支持');
    return;
  }
  if (isCropMode()) {
    updateButtonStatus();
    return;
  }
  try {
    if (imgSlotCount <= 0) await imgRefreshInfo({ quiet: true });
    const slot = imgSelectedSlot();
    setTransferProgress(0, `准备发送到槽位 ${imgSlotNo(slot)}…`, { reset: true });
    const { payload, width, height } = await prepareCanvasBwr();
    const { blob, crc } = buildImgSlotBlob(payload, width, height);
    addLog(`发送图片到槽位 ${imgSlotNo(slot)}：${blob.length} 字节 (${width}x${height})`);
    const done = await uploadFlashPayload(blob, blob.length, crc, EpdCmd.IMG_BEGIN, 'flash=ok', `图片槽${imgSlotNo(slot)}`, [slot]);
    imgSelectedSlotIdx = slot;
    imgMaskSet(slot, true);
    imgSlotPayloadCache[slot] = new Uint8Array(payload);
    imgUpdateSlotSelect();
    if (bleDevice && bleDevice.gatt.connected) {
      try {
        await imgRefreshInfo({ keepSlot: slot, quiet: true, forceSlot: slot });
      } catch (_) {}
    }
    const status = done && done.status ? done.status : `槽位 ${imgSlotNo(slot)} 已保存`;
    setTransferProgress(100, `${status}，等待刷屏…`);
    setStatus(`${status}，正在刷屏显示…`);
    await imgShowSlot();
    clearTransferProgress(`槽位 ${imgSlotNo(slot)} 已显示`);
  } catch (e) {
    if (String(e.message || e) === 'cancelled') return;
    clearTransferProgress('发送失败');
    addLog(e.message || String(e));
    await appAlert(e.message || String(e), '发送失败');
  }
}

function parseFlashAckCount(msg) {
  if (msg.startsWith('flash=ack:')) {
    const n = parseInt(msg.slice('flash=ack:'.length), 10);
    return (Number.isFinite(n) && n > 0) ? n : 1;
  }
  if (msg === 'flash=ack' || msg.startsWith('flash=ack')) return 1;
  return 0;
}

function waitFlashNotify(prefix, timeoutMs = 120000, altPrefix = null, opts = null) {
  return new Promise((resolve, reject) => {
    if (flashNotifyWait) {
      const prev = flashNotifyWait;
      flashNotifyWait = null;
      try {
        if (prev._timer) clearTimeout(prev._timer);
        prev.reject(new Error('cancelled'));
      } catch (_) {}
    }
    let timer = null;
    const arm = () => {
      if (timer) clearTimeout(timer);
      timer = setTimeout(() => {
        if (flashNotifyWait && flashNotifyWait.reject === reject) flashNotifyWait = null;
        reject(new Error(`等待 ${prefix} 超时`));
      }, timeoutMs);
      if (flashNotifyWait && flashNotifyWait.reject === reject) {
        flashNotifyWait._timer = timer;
      }
    };
    flashNotifyWait = {
      prefix,
      altPrefix,
      match: opts && opts.match ? opts.match : null,
      ignore: opts && opts.ignore ? opts.ignore : null,
      bump: arm,
      _timer: null,
      resolve: (msg) => { clearTimeout(timer); flashNotifyWait = null; resolve(msg); },
      reject,
    };
    arm();
  });
}

function onFlashNotify(msg) {
  if (msg.startsWith('flash=busy') || msg.startsWith('flash=wait') || msg.startsWith('cal=busy')) {
    flashBusyFlag = true;
  }
  if (msg === 'flash=ack' || msg.startsWith('flash=ack:')) {
    flashAckCredits += parseFlashAckCount(msg);
  }
  if (msg.startsWith('flash=err') || msg.startsWith('flash=busy') ||
      msg.startsWith('flash=wait') || msg.startsWith('cal=busy')) {
    flashAckError = msg;
  }
  if (!flashNotifyWait) return;
  if (msg.startsWith('flash=erase') || msg.startsWith('flash=verify') ||
      msg.startsWith('flash=wait')) {
    flashNotifyWait.bump && flashNotifyWait.bump();
    if (msg.startsWith('flash=verify')) addLog('设备开始校验…');
    return;
  }
  if (flashNotifyWait.ignore && flashNotifyWait.ignore(msg)) {
    flashNotifyWait.bump && flashNotifyWait.bump();
    return;
  }
  if (msg === 'img=queued' &&
      (flashNotifyWait.prefix.startsWith('img=') || flashNotifyWait.match)) {
    flashNotifyWait.bump && flashNotifyWait.bump();
    return;
  }
  if (flashNotifyWait.match) {
    if (flashNotifyWait.match(msg)) flashNotifyWait.resolve(msg);
    return;
  }
  if (msg.startsWith(flashNotifyWait.prefix) ||
      (flashNotifyWait.altPrefix && msg.startsWith(flashNotifyWait.altPrefix))) {
    flashNotifyWait.resolve(msg);
  }
}

async function uploadFlashPayload(buf, size, crc, beginCmd, okPrefix, label, beginPrefix) {
  const progOpts = { scope: 'send' };
  const progReset = { scope: 'send', reset: true };
  const mtu = await ensureFlashMtuReady(isAppleWebBle ? 10000 : 5000);
  const mtuEl = document.getElementById('mtusize');
  if (mtuEl) mtuEl.value = mtu;
  const useExt = !!rleSupport;
  const maxPayload = Math.max(8, flashChunkSizeFromMtu(mtu) - (useExt ? 1 : 0));
  /* Keep ≤1 queue slot/packet (device Q depth=4). Larger RLE expand thrash → flash=busy. */
  const maxUncPack = 192;
  const rawWindow = Math.min(192, maxPayload);

  let packets = null;
  let useStreamRle = false;
  if (useExt && typeof rlePackFlashPackets === 'function') {
    const packed = rlePackFlashPackets(buf, maxPayload, maxUncPack);
    const rleTotal = packed.reduce((t, p) => t + p.rle.length, 0);
    if (rleTotal < size && packed.length > 0) {
      packets = packed.map((p) => ({
        offset: p.offset,
        unc: p.unc,
        payload: [...u32le(p.offset), 0x01, ...p.rle],
      }));
      useStreamRle = true;
      addLog(`RLE 流式: ${size}→${rleTotal}B, ${packets.length} 包`);
    }
  }
  if (!packets) {
    packets = [];
    for (let off = 0; off < size; ) {
      const n = Math.min(rawWindow, size - off);
      const slice = buf.slice(off, off + n);
      if (useExt) {
        packets.push({ offset: off, unc: n, payload: [...u32le(off), 0x00, ...slice] });
      } else {
        packets.push({ offset: off, unc: n, payload: [...u32le(off), ...slice] });
      }
      off += n;
    }
    if (!useExt) addLog('提示: 未协商到 rle=1（需含 RLE 的固件）');
  }

  addLog(`开始烧录${label}: ${size} 字节, CRC=0x${crc.toString(16)}, pkts=${packets.length}, mtu=${mtu}, RLE=${useStreamRle ? 'stream' : (useExt ? 'ext' : 'off')}`);
  setTransferProgress(0, `${label}：准备中…`, progReset);
  await yieldUiPaint();
  startTime = new Date().getTime();
  setFlashBusy(true, `${label}传输中，请稍候…`);

  try {
    const beginBody = [
      ...(beginPrefix || []),
      ...u32le(size),
      ...u32le(crc),
      ...(useExt ? [0x01] : []),
    ];
    let readyMsg = null;
    for (let beginTry = 0; beginTry < 40; beginTry++) {
      flashBusyFlag = false;
      flashAckError = null;
      const readyPromise = waitFlashNotify('flash=ready', 180000, null, {
        match: (msg) =>
          msg === 'flash=ready' ||
          msg.startsWith('flash=busy') ||
          msg.startsWith('flash=err') ||
          msg.startsWith('flash=bad'),
      });
      if (!await write(beginCmd, beginBody, true)) {
        setTransferProgress(null, `${label}：BEGIN 失败`, progOpts);
        throw new Error('BEGIN 失败');
      }
      try {
        readyMsg = await readyPromise;
      } catch (e) {
        setTransferProgress(null, `${label}：就绪超时`, progOpts);
        addLog(e.message || String(e));
        throw e;
      }
      if (readyMsg === 'flash=ready') break;
      /* Panel refresh blocks main loop — wait and retry BEGIN. */
      addLog(`BEGIN 等待设备空闲 ${beginTry + 1}: ${readyMsg}`);
      setTransferProgress(0, `${label}：屏幕忙，等待空闲…`, progOpts);
      await sleepMs(800);
    }
    if (readyMsg !== 'flash=ready') {
      setTransferProgress(null, `${label}：${readyMsg}`, progOpts);
      throw new Error(readyMsg || 'BEGIN 失败');
    }
    addLog('设备就绪，开始传数据');
    await sleepMs(20);
    setTransferProgress(1, `${label}：0/${size}`, progOpts);

    let sendOffset = 0;
    let retries = 0;
    let pktIdx = 0;
    let firstChunkLogged = false;
    flashBusyFlag = false;
    flashAckCredits = 0;
    flashAckError = null;

    while (pktIdx < packets.length) {
      if (!bleDevice || !bleDevice.gatt.connected) {
        setTransferProgress(null, '蓝牙已断开', progOpts);
        throw new Error('蓝牙已断开');
      }
      if (flashAckError && String(flashAckError).startsWith('flash=err')) {
        setTransferProgress(null, `${label}：flash=err`, progOpts);
        throw new Error(flashAckError);
      }
      const pkt = packets[pktIdx];
      flashBusyFlag = false;
      flashAckError = null;
      const ok = await write(EpdCmd.FLASH_DATA, pkt.payload, true);
      if (!ok) {
        retries++;
        if (retries > 40) {
          setTransferProgress(null, `${label}：写入失败`, progOpts);
          throw new Error(`写入失败 @${pkt.offset}`);
        }
        await sleepMs(20);
        continue;
      }
      if (!firstChunkLogged) {
        firstChunkLogged = true;
        addLog(`首包完成，共 ${packets.length} 包…`);
      }
      /* Give main-loop SPI a moment before next WithResponse write. */
      await sleepMs(8);
      if (flashAckError && String(flashAckError).startsWith('flash=err')) {
        setTransferProgress(null, `${label}：flash=err`, progOpts);
        throw new Error(flashAckError);
      }
      if (flashBusyFlag ||
          (flashAckError &&
           (String(flashAckError).startsWith('flash=busy') ||
            String(flashAckError).startsWith('flash=wait')))) {
        flashBusyFlag = false;
        flashAckError = null;
        retries++;
        if (retries > 100) throw new Error(`设备忙，放弃 @${pkt.offset}`);
        await sleepMs(60);
        continue;
      }
      sendOffset = pkt.offset + pkt.unc;
      pktIdx++;
      retries = 0;
      {
        const sec = ((new Date().getTime() - startTime) / 1000).toFixed(1);
        const pct = 1 + (sendOffset / size) * 94;
        const msg = `${label}：${sendOffset}/${size} 包${pktIdx}/${packets.length} (${pct.toFixed(1)}%, ${sec}s)`;
        setTransferProgress(pct, msg, progOpts);
        if ((pktIdx & 1) === 0) await yieldUiPaint();
      }
    }

    setTransferProgress(96, `${label}：校验中…`, progOpts);
    const okPromise = waitFlashNotify(okPrefix, 180000, 'flash=bad', {
      match: (msg) =>
        msg === okPrefix ||
        msg.startsWith('flash=bad') ||
        msg.startsWith('flash=err') ||
        (okPrefix === 'flash=ok' && msg === 'img=ok'),
      ignore: (msg) => msg === 'img=queued' || /^img=\d+,/.test(msg),
    });
    if (!await write(EpdCmd.FLASH_END, null, true)) {
      setTransferProgress(null, `${label}：END 失败`, progOpts);
      throw new Error('END 失败');
    }
    try {
      const msg = await okPromise;
      const sec = ((new Date().getTime() - startTime) / 1000).toFixed(1);
      const status = `${label}完成：${msg}，耗时 ${sec}s`;
      setTransferProgress(100, status, progOpts);
      addLog(`烧录结束: ${msg}，耗时 ${sec}s`);
      if (String(msg).includes('bad') || String(msg).includes('err')) throw new Error(msg);
      return { msg, status, elapsedSec: parseFloat(sec) };
    } catch (e) {
      setTransferProgress(null, `${label}：结束超时`, progOpts);
      addLog(e.message || String(e));
      throw e;
    }
  } finally {
    setFlashBusy(false);
  }
}

function setTransferProgress(pct, text, opts = null) {
  if (text != null) setStatus(text);
  const bar = document.getElementById('xferBar');
  const fill = document.getElementById('xferBarFill');
  const statusBar = document.querySelector('.transfer-status') || document.querySelector('.status-bar');
  if (statusBar) statusBar.style.display = 'flex';
  if (!bar || !fill) return;
  if (pct == null) {
    bar.hidden = true;
    fill.style.width = '0%';
    xferProgressLast.send = -1;
    return;
  }
  bar.hidden = false;
  let v = Math.max(0, Math.min(100, Number(pct) || 0));
  if (opts && opts.reset) xferProgressLast.send = -1;
  const last = xferProgressLast.send;
  if (last >= 0 && v < last) v = last;
  xferProgressLast.send = v;
  fill.style.width = `${v}%`;
}

function clearTransferProgress(text) {
  setTransferProgress(null, text == null ? '空闲' : text);
}

async function syncTime(mode) {
  if (mode === 2) {
    if (!await appConfirm('时钟模式比较费电，并且会缩短屏幕寿命，不建议长期开启，是否继续？', '提醒')) return;
  }
  const timestamp = new Date().getTime() / 1000;
  const data = new Uint8Array([
    (timestamp >> 24) & 0xFF,
    (timestamp >> 16) & 0xFF,
    (timestamp >> 8) & 0xFF,
    timestamp & 0xFF,
    -(new Date().getTimezoneOffset() / 60),
    mode
  ]);
  if (await write(EpdCmd.SET_TIME, data)) {
    addLog("时间已同步！");
    addLog("屏幕刷新完成前请不要操作。");
    if (mode === 0) {
      addLog('已切换图片模式（不会自动刷屏；请点「显示此槽」）');
    } else {
      setEpdBusyForRefresh();
    }
  }
}

async function enterPictureMode() {
  if (!checkBluetoothConnection()) return;
  if (!imgMultiSupported) {
    await appAlert('当前固件不支持图片模式多图存储，请升级固件。', '不支持');
    return;

  if (imgSlotCount > 0 && imgMaskUsedSlots().length > 0) {

    );
    if (!go) return;

    await imgShowSlot();

  await syncTime(0);
  await appAlert('已进入图片模式。请先上传图片到槽位，再点「显示此槽」。', '图片模式');
}

// Rotate ImageData 90 degrees counterclockwise
function rotateImageDataCounterclockwise(imageData) {
  const width = imageData.width;
  const height = imageData.height;
  const data = imageData.data;
  
  // Create new ImageData with swapped dimensions
  const rotatedImageData = new ImageData(height, width);
  const rotatedData = rotatedImageData.data;
  
  // Rotate counterclockwise: (x, y) -> (y, width - 1 - x)
  for (let y = 0; y < height; y++) {
    for (let x = 0; x < width; x++) {
      const srcIndex = (y * width + x) * 4;
      const dstX = y;
      const dstY = width - 1 - x;
      const dstIndex = (dstY * height + dstX) * 4;
      
      rotatedData[dstIndex] = data[srcIndex];         // R
      rotatedData[dstIndex + 1] = data[srcIndex + 1]; // G
      rotatedData[dstIndex + 2] = data[srcIndex + 2]; // B
      rotatedData[dstIndex + 3] = data[srcIndex + 3]; // A
    }
  }
  
  return rotatedImageData;
}

async function sendimg() {
  if (!canvas || !ctx) {
    addLog("画布未初始化，无法发送图片");
    return;
  }
  
  if (isCropMode()) {
    updateButtonStatus();
    return;
  }

  const canvasSize = document.getElementById('canvasSize').value;
  const ditherMode = document.getElementById('ditherMode').value;
  const epdDriverSelect = document.getElementById('epddriver');
  const selectedOption = epdDriverSelect.options[epdDriverSelect.selectedIndex];

  if (selectedOption.getAttribute('data-color') !== ditherMode) {
    if (!await appConfirm('颜色模式和驱动不匹配，是否继续？', '警告')) return;
  }

  startTime = new Date().getTime();
  setTransferProgress(0, '准备发送到屏幕…', { reset: true });
  await ensureFlashMtuReady(isAppleWebBle ? 10000 : 5000);

  let imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  
  addLog(`发送图像: 画布尺寸=${canvas.width}x${canvas.height}, 颜色模式=${ditherMode}`);
  
  const is42 = selectedOption && selectedOption.getAttribute('data-size42') === 'true';
  if (is42) {
    addLog("4.2inch: using native 400x300 layout");
    if (canvas.width === 300 && canvas.height === 400) {
      addLog("检测到 4.2 画布已旋转为 300x400，发送前纠正回 400x300");
      imageData = rotateImageDataCounterclockwise(imageData); // 300x400 -> 400x300
    } else if (!(canvas.width === 400 && canvas.height === 300)) {
      addLog(`警告：4.2 画布尺寸异常(${canvas.width}x${canvas.height})，建议切换回 400x300 以避免乱码`);
    }
  } else {
    // If canvas is landscape (width > height), rotate to portrait for non-4.2 screens
    if (canvas.width > canvas.height) {
      addLog(`检测到横屏画布(${canvas.width}x${canvas.height})，旋转图像数据为竖屏方向`);
      imageData = rotateImageDataCounterclockwise(imageData);
      addLog(`检测到横屏画布(${canvas.width}x${canvas.height})，已旋转图像数据为竖屏方向`);
    }
  }
  
  const processedData = processImageData(imageData, ditherMode);

  updateButtonStatus(true);

  let sent = false;
  if (ditherMode === 'fourColor') {
    sent = await writeImage(processedData, 'color');
  } else if (ditherMode === 'threeColor') {
    const halfLength = Math.floor(processedData.length / 2);
    sent = await writeImage(processedData.slice(0, halfLength), 'bw');
    if (sent) sent = await writeImage(processedData.slice(halfLength), 'red');
  } else if (ditherMode === 'blackWhiteColor') {
    sent = await writeImage(processedData, 'bw');
  } else {
    addLog("当前固件不支持此颜色模式。");
    updateButtonStatus();
    clearTransferProgress('模式不支持');
    return;
  }

  if (!sent) {
    updateButtonStatus();
    clearTransferProgress('发送失败');
    addLog('直写屏幕失败：蓝牙写入中断。槽位显示后请稍候再试，或重连后重试。');
    return;
  }

  await write(EpdCmd.REFRESH);
  updateButtonStatus();

  const sendTime = (new Date().getTime() - startTime) / 1000.0;
  addLog(`发送完成！耗时: ${sendTime}s`);
  setTransferProgress(100, `发送完成！耗时: ${sendTime}s`);
  addLog("屏幕刷新完成前请不要操作。");
  setEpdBusyForRefresh();
  setTimeout(() => clearTransferProgress('空闲'), epdRefreshGuardMs());
}

async function downloadDataArray() {
  if (!canvas || !ctx) {
    addLog("画布未初始化，无法下载数据");
    return;
  }
  
  if (isCropMode()) {
    await appAlert('请先完成图片裁剪！下载已取消。\n放大并移动图片使其充满画布，然后点击「完成」。', '需要裁剪');
    return;
  }

  const mode = document.getElementById('ditherMode').value;
  const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const processedData = processImageData(imageData, mode);

  if (mode === 'sixColor' && processedData.length !== canvas.width * canvas.height) {
    console.log(`错误：预期${canvas.width * canvas.height}字节，但得到${processedData.length}字节`);
    addLog('数组大小不匹配。请检查图像尺寸和模式。');
    return;
  }

  const dataLines = [];
  for (let i = 0; i < processedData.length; i++) {
    const hexValue = (processedData[i] & 0xff).toString(16).padStart(2, '0');
    dataLines.push(`0x${hexValue}`);
  }

  const formattedData = [];
  for (let i = 0; i < dataLines.length; i += 16) {
    formattedData.push(dataLines.slice(i, i + 16).join(', '));
  }

  const colorModeValue = mode === 'sixColor' ? 0 : mode === 'fourColor' ? 1 : mode === 'blackWhiteColor' ? 2 : 3;
  const arrayContent = [
    'const uint8_t imageData[] PROGMEM = {',
    formattedData.join(',\n'),
    '};',
    `const uint16_t imageWidth = ${canvas.width};`,
    `const uint16_t imageHeight = ${canvas.height};`,
    `const uint8_t colorMode = ${colorModeValue};`
  ].join('\n');

  const blob = new Blob([arrayContent], { type: 'text/plain' });
  const link = document.createElement('a');
  link.download = 'imagedata.h';
  link.href = URL.createObjectURL(blob);
  link.click();
  URL.revokeObjectURL(link.href);
}

function updateButtonStatus(forceDisabled = false) {
  const connected = gattServer != null && gattServer.connected;
  const busy = forceDisabled || flashOpActive || epdBusy;
  const status = busy ? 'disabled' : (connected ? null : 'disabled');
  const cropBusy = (typeof isCropMode === 'function') && isCropMode();
  const sendDisabled = status || (cropBusy ? 'disabled' : null);
  const reconBtn = document.getElementById("reconnectbutton");
  if (reconBtn) reconBtn.disabled = bleDevice ? false : true;
  document.getElementById("sendcmdbutton").disabled = status;
  document.getElementById("calendarmodebutton").disabled = status;
  document.getElementById("debugcalendarbutton").disabled = status;
  document.getElementById("clockmodebutton").disabled = status;
  const picBtn = document.getElementById("picturemodebutton");

  document.getElementById("clearscreenbutton").disabled = status;
  document.getElementById("sendimgbutton").disabled = sendDisabled;

  if (sendDirect) sendDirect.disabled = sendDisabled;

}

function disconnect() {
  if (reconnecting) {
    if (typeof updateButtonStatus === 'function') updateButtonStatus();
    return;
  }
  if (flashNotifyWait && flashNotifyWait.reject) {
    try { flashNotifyWait.reject(new Error('蓝牙已断开')); } catch (_) {}
    flashNotifyWait = null;
  }
  updateButtonStatus();
  resetVariables();
  // Hide feature options when disconnecting (they will be shown again if device supports them)
  const ledGroup = document.getElementById('ledSelectGroup');
  if (ledGroup) ledGroup.style.display = 'none';
  const deviceIdGroup = document.getElementById('showDeviceIdGroup');
  if (deviceIdGroup) deviceIdGroup.style.display = 'none';
  const bleModeGroup = document.getElementById('bleModeGroup');
  if (bleModeGroup) bleModeGroup.style.display = 'none';
  const calendarThemeGroup = document.getElementById('calendarThemeGroup');
  if (calendarThemeGroup) calendarThemeGroup.style.display = 'none';
  const clockThemeGroup = document.getElementById('clockThemeGroup');
  if (clockThemeGroup) clockThemeGroup.style.display = 'none';
  addLog('已断开连接.');
  document.getElementById("connectbutton").innerHTML = '连接';
}

async function preConnect() {
  if (gattServer != null && gattServer.connected) {
    if (bleDevice != null && bleDevice.gatt.connected) {
      bleDevice.gatt.disconnect();
    }
  }
  else {
    resetVariables();
    try {
      bleDevice = await navigator.bluetooth.requestDevice({
        filters: [{ namePrefix: 'NRF' }],
        optionalServices: ['62750001-d828-918d-fb46-b6c11c675aec']
      });
    } catch (e) {
      console.error(e);
      if (e.message) addLog("requestDevice: " + e.message);
      addLog("请检查蓝牙是否已开启，且使用的浏览器支持蓝牙！建议使用以下浏览器：");
      addLog("• 电脑: Chrome/Edge");
      addLog("• Android: Chrome/Edge");
      addLog("• iOS: Bluefy 浏览器");
      return;
    }

    await bleDevice.addEventListener('gattserverdisconnected', disconnect);
    setTimeout(async function () { await connect(); }, 300);
  }
}

async function reConnect() {
  if (!bleDevice) {
    addLog("请先用「连接」选择设备");
    return;
  }
  reconnecting = true;
  try {
    if (bleDevice.gatt && bleDevice.gatt.connected) {
      bleDevice.gatt.disconnect();
    }
  } catch (_) {}
  gattServer = null;
  epdService = null;
  epdCharacteristic = null;
  rleSupport = false;
  addLog("正在重连");
  setTimeout(async function () {
    try {
      await connect();
    } finally {
      reconnecting = false;
    }
  }, 400);
}

function handleNotify(value, idx) {
  const data = new Uint8Array(value.buffer, value.byteOffset, value.byteLength);
  if (idx == 0 && !looksLikeEpdTextNotify(data)) {
    addLog(`收到配置：${bytes2hex(data)}`);
    const epdpins = document.getElementById("epdpins");
    const epddriver = document.getElementById("epddriver");
    epdpins.value = bytes2hex(data.slice(0, 7));
    if (data.length > 10) epdpins.value += bytes2hex(data.slice(10, 11));
    const keyEl = document.getElementById("epdkeypin");
    if (keyEl && data.length > 8) keyEl.value = String(data[8]);
    epddriver.value = bytes2hex(data.slice(7, 8));
    updateDitcherOptions();
    updateDeviceControlVisibility();
    addLog(`配置已读取，等待设备信息...`);
  } else {
    /* Image readback chunk: "im=" + u16le + data */
    if (data.length >= 5 && data[0] === 0x69 && data[1] === 0x6d && data[2] === 0x3d) {
      onImgBinaryChunk(data);
      return;
    }
    if (textDecoder == null) textDecoder = new TextDecoder();
    const msg = textDecoder.decode(data);
    if (!(msg === 'flash=ack' || msg.startsWith('flash=ack:'))) {
      addLog(msg, '⇓');
    }
    if (msg.startsWith('flash=') || msg.startsWith('img=') || msg.startsWith('imgr=')) {
      onFlashNotify(msg);
    }
    if (msg.indexOf('fwid=') >= 0) {
      const id = parseFwidValue(msg);
      if (id && firmwareVariant !== id) addLog(`固件标识: ${id}`);
      if (id) noteImgMultiFromFwid(id);
    }
    if (msg.indexOf('fwver=') >= 0) {
      const m = /fwver\s*=\s*(\d+)\.(\d+)\.(\d+)(?:\s*,\s*(\d+))?/.exec(msg);
      if (m) {
        const build = m[4] != null ? parseInt(m[4], 10) : null;
        firmwareVersionLabel = Number.isFinite(build)
          ? `v${m[1]}.${m[2]}.${m[3]}(b${build})`
          : `v${m[1]}.${m[2]}.${m[3]}`;
        if (Number.isFinite(build)) {
          firmwareVersion = build;
          noteImgMultiFromFirmwareVersion(firmwareVersion);
        }
        updateFirmwareVersionLog(firmwareVersionLabel);
      }
    }
    if (/^img=\d+,/.test(msg) && !flashOpActive) {
      applyImgInfoNotify(msg);
    }
    if (msg.startsWith('mtu=') && msg.length > 4) {
      const mtuSize = parseInt(msg.substring(4), 10);
      if (Number.isFinite(mtuSize) && mtuSize >= 20) {
        negotiatedMaxDataLen = mtuSize;
        const mtuEl = document.getElementById('mtusize');
        if (mtuEl) mtuEl.value = mtuSize;
        if (/\brle=1\b/.test(msg)) {
          rleSupport = true;
          addLog(`MTU=${mtuSize}, RLE=on (chunk≤${flashChunkSizeFromMtu(mtuSize)})`);
        } else {
          addLog(`MTU=${mtuSize}, RLE=off (chunk≤${flashChunkSizeFromMtu(mtuSize)})`);
        }
      }
    } else if (msg.startsWith('t=') && msg.length > 2) {
      const t = parseInt(msg.substring(2)) + new Date().getTimezoneOffset() * 60;
      addLog(`远端时间: ${new Date(t * 1000).toLocaleString()}`);
      addLog(`本地时间: ${new Date().toLocaleString()}`);
    } else if (msg.startsWith('device=') && msg.length > 7) {
      const m = /^device=\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)/.exec(msg);
      if (m) {
        deviceInfo.modelId = parseInt(m[1], 10);
        deviceInfo.width = parseInt(m[2], 10);
        deviceInfo.height = parseInt(m[3], 10);
        addLog(`设备信息: 型号=${deviceInfo.modelId}, 尺寸=${deviceInfo.width}x${deviceInfo.height}`);
        updateUIForDevice();
        if (isSmallCarouselFwid(firmwareVariant) || (firmwareVersion != null && firmwareVersion >= FW_IMG_MULTI_MIN)) {
          scheduleImgSlotRefresh(700);
        }
      }
    } else if (msg.startsWith('led=') && msg.length > 4) {
      const mode = msg.substring(4);
      setLedSelect(mode);
      // Show LED control only when device supports it AND model is not 4.2" (4.2" does not support LED)
      const ledGroup = document.getElementById('ledSelectGroup');
      if (ledGroup) {
        const epdDriverSelect = document.getElementById('epddriver');
        const opt = epdDriverSelect && epdDriverSelect.options[epdDriverSelect.selectedIndex];
        const is42 = opt && opt.getAttribute('data-size42') === 'true';
        if (!is42) ledGroup.style.display = '';
        // else keep hidden for 4.2", do not show even in debug mode
      }
      addLog(`时钟LED闪烁模式: ${mode}`);
    } else if (msg.startsWith('show_device_id=') && msg.length > 15) {
      const value = msg.substring(15);
      setShowDeviceIdSelect(value);
      // Show device ID option when device sends show_device_id state (device supports this feature)
      const deviceIdGroup = document.getElementById('showDeviceIdGroup');
      if (deviceIdGroup) deviceIdGroup.style.display = '';
      addLog(`设备ID显示: ${value === '1' ? '显示' : '隐藏'}`);
    } else if (msg.startsWith('ble_mode=') && msg.length > 8) {
      const value = msg.substring(9);
      setBleModeSelect(value);
      // Show BLE mode option when device sends ble_mode state (device supports this feature)
      const bleModeGroup = document.getElementById('bleModeGroup');
      if (bleModeGroup) bleModeGroup.style.display = '';
      const modeText = {
        '0': '关闭蓝牙',
        '1': '每小时开启5分钟',
        '2': '每10分钟开启1分钟',
        '3': '保持打开'
      };
      addLog(`蓝牙广播模式: ${modeText[value] || value}`);
    } else if (msg.startsWith('calendar_theme=') && msg.length > 14) {
      const value = msg.substring(15);
      setCalendarThemeSelect(value);
      // Show calendar theme option when device sends calendar_theme state (device supports this feature)
      const calendarThemeGroup = document.getElementById('calendarThemeGroup');
      if (calendarThemeGroup) calendarThemeGroup.style.display = '';
      const themeText = {
        '0': '主题1',
        '1': '主题2',
        '2': '主题3',
        '3': '主题4'
      };
      addLog(`日历主题: ${themeText[value] || value}`);
    } else if (msg.startsWith('clock_theme=') && msg.length > 11) {
      const value = msg.substring(12);
      setClockThemeSelect(value);
      // Show clock theme option when device sends clock_theme state (device supports this feature)
      const clockThemeGroup = document.getElementById('clockThemeGroup');
      if (clockThemeGroup) clockThemeGroup.style.display = '';
      const themeText = {
        '0': '主题1',
        '1': '主题2'
      };
      addLog(`时钟主题: ${themeText[value] || value}`);
    } else if (msg.startsWith('temperature_offset=') && msg.length > 19) {
      // Parse signed integer (can be negative)
      const valueStr = msg.substring(19);
      const value = parseInt(valueStr);
      updateTemperatureOffsetDisplay(value);
      // Show temperature calibration option when device sends temperature_offset state
      const temperatureCalibrationGroup = document.getElementById('temperatureCalibrationGroup');
      if (temperatureCalibrationGroup) temperatureCalibrationGroup.style.display = '';
      const offsetText = value > 0 ? `+${value}` : `${value}`;
      addLog(`温度校准偏移量: ${offsetText}℃`);
    } else if (msg.startsWith('firmware_version=') && msg.length > 17) {
      const parsed = parseFirmwareVersionPayload(msg.substring(17));
      if (parsed && parsed.build != null) {
        firmwareVersion = parsed.build;
        if (!firmwareVersionLabel) firmwareVersionLabel = parsed.label;
        noteImgMultiFromFirmwareVersion(firmwareVersion);
      }
      const versionText = firmwareVersionLabel || (firmwareVersion != null ? `v2.0.0(b${firmwareVersion})` : '');
      updateFirmwareVersionLog(versionText);
    }
  }
}

// Temperature calibration offset (stored as signed 8-bit: -128 to 127)
let currentTemperatureOffset = 0;

function updateTemperatureOffsetDisplay(offset) {
  currentTemperatureOffset = offset;
  const display = document.getElementById('temperatureOffsetDisplay');
  if (display) {
    const offsetText = offset > 0 ? `偏移量: +${offset}℃` : `偏移量: ${offset}℃`;
    display.textContent = offsetText;
  }
}

async function adjustTemperatureOffset(delta) {
  if (!checkBluetoothConnection()) {
    addLog('请先连接蓝牙设备');
    return;
  }
  
  // Calculate new offset value
  let newOffset = currentTemperatureOffset + delta;
  
  // Clamp to signed 8-bit range (-128 to 127)
  if (newOffset > 127) {
    newOffset = 127;
    addLog('温度偏移量已达到最大值 (127℃)');
    return;
  }
  if (newOffset < -128) {
    newOffset = -128;
    addLog('温度偏移量已达到最小值 (-128℃)');
    return;
  }
  
  // Convert to unsigned 8-bit for transmission (signed values are sent as two's complement)
  const offsetByte = newOffset < 0 ? (256 + newOffset) : newOffset;
  
  const success = await write(EpdCmd.SET_TEMPERATURE_OFFSET, [offsetByte]);
  if (success) {
    updateTemperatureOffsetDisplay(newOffset);
    const offsetText = newOffset > 0 ? `+${newOffset}` : `${newOffset}`;
    addLog(`温度校准偏移量已更新: ${offsetText}℃`);
  } else {
    addLog('温度校准偏移量设置失败');
  }
}

async function connect() {
  if (bleDevice == null || epdCharacteristic != null) return;

  try {
    addLog("正在连接: " + bleDevice.name);
    gattServer = await bleDevice.gatt.connect();
    addLog('  找到 GATT Server');
    epdService = await gattServer.getPrimaryService('62750001-d828-918d-fb46-b6c11c675aec');
    addLog('  找到 EPD Service');
    epdCharacteristic = await epdService.getCharacteristic('62750002-d828-918d-fb46-b6c11c675aec');
    addLog('  找到 Characteristic');
  } catch (e) {
    console.error(e);
    if (e.message) addLog("connect: " + e.message);
    disconnect();
    return;
  }

  try {
    const versionCharacteristic = await epdService.getCharacteristic('62750003-d828-918d-fb46-b6c11c675aec');
    const versionData = await versionCharacteristic.readValue();
    appVersion = versionData.getUint8(0);
    // Firmware version will be updated when device sends firmware_version message
    addLog(`固件版本: 0x${appVersion.toString(16)}`);
  } catch (e) {
    console.error(e);
    appVersion = 0x15;
  }

  if (appVersion < 0x16) {
    const oldURL = "https://tsl0922.github.io/EPD-nRF5/v1.5";
    await appAlert('当前固件版本过低，可能无法正常使用部分功能，建议升级到最新版本。', '注意');
    if (await appConfirm('是否访问旧版本上位机？', '固件过旧')) location.href = oldURL;
    setTimeout(() => {
      addLog(`如遇到问题，可访问旧版本上位机: ${oldURL}`);
    }, 500);
  }

  try {
    /* Listen before CCCD enable so the first notifies are not dropped. */
    epdCharacteristic.addEventListener('characteristicvaluechanged', (event) => {
      handleNotify(event.target.value, msgIndex++);
    });
    await epdCharacteristic.startNotifications();
  } catch (e) {
    console.error(e);
    if (e.message) addLog("startNotifications: " + e.message);
  }

  await write(EpdCmd.INIT);
  epdInitDone = true;

  document.getElementById("connectbutton").innerHTML = '断开';
  updateButtonStatus();
  if (firmwareVersion != null) noteImgMultiFromFirmwareVersion(firmwareVersion);
  if (isSmallCarouselFwid(firmwareVariant)) noteImgMultiFromFwid(firmwareVariant);
  scheduleImgSlotRefresh(800);
}

function addLog(logTXT, action = '') {
  const log = document.getElementById("log");
  const now = new Date();
  const time = String(now.getHours()).padStart(2, '0') + ":" +
    String(now.getMinutes()).padStart(2, '0') + ":" +
    String(now.getSeconds()).padStart(2, '0') + " ";

  const logEntry = document.createElement('div');
  const timeSpan = document.createElement('span');
  timeSpan.className = 'time';
  timeSpan.textContent = time;
  logEntry.appendChild(timeSpan);

  if (action !== '') {
    const actionSpan = document.createElement('span');
    actionSpan.className = 'action';
    actionSpan.innerHTML = action;
    logEntry.appendChild(actionSpan);
  }
  logEntry.appendChild(document.createTextNode(logTXT));

  log.appendChild(logEntry);
  log.scrollTop = log.scrollHeight;

  while (log.childNodes.length > 20) {
    log.removeChild(log.firstChild);
  }
}
